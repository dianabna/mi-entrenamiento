<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#c1663f">
<title>Mi Entrenamiento · Diana</title>
<style>
  :root{
    --terra:#c1663f; --terra-dark:#9e4f2f; --sand:#f4ece2; --cream:#fbf7f1;
    --teal:#2f7d78; --teal-light:#e0efed; --ink:#2c2723; --muted:#8a7f74;
    --line:#e6dccf; --ok:#4a8f5a; --blue:#3b6ea5; --green:#4a8f5a; --shadow:0 2px 10px rgba(80,55,35,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.45;padding-bottom:90px;
  }
  header{
    background:linear-gradient(135deg,var(--terra),var(--terra-dark));
    color:#fff;padding:18px 16px 16px;box-shadow:var(--shadow);
  }
  header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
  header p{margin:2px 0 0;font-size:12px;opacity:.9}
  .stats{display:flex;gap:8px;margin-top:12px}
  .stat{flex:1;background:rgba(255,255,255,.15);border-radius:12px;padding:8px 6px;text-align:center}
  .stat b{display:block;font-size:20px;line-height:1}
  .stat span{font-size:10px;opacity:.9;display:block;margin-top:3px}
  .progwrap{margin-top:10px}
  .progbar{height:7px;background:rgba(255,255,255,.25);border-radius:20px;overflow:hidden}
  .progfill{height:100%;background:#fff;border-radius:20px;transition:width .4s}
  .progtxt{font-size:10px;opacity:.9;margin-top:4px;text-align:center}

  nav{display:flex;justify-content:center;gap:4px;padding:12px 12px 8px;position:sticky;top:0;background:var(--cream);z-index:10}
  nav .homelink{background:none!important;color:var(--ink)!important;border:none;padding:4px 8px;font-size:15px;font-weight:800;text-decoration:underline;text-underline-offset:5px;cursor:pointer}

  /* Resumen: botones de colores */
  .tiles{display:grid;gap:8px;margin-bottom:10px}
  .tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{border-radius:14px;padding:12px 8px;text-align:center;font-weight:800;font-size:14px;cursor:pointer;border:1px solid;line-height:1.25}
  .tile small{display:block;font-weight:600;font-size:11.5px;margin-top:3px;opacity:.85}
  .tile:active{transform:scale(.98)}
  .th-a{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC}
  .th-b{background:#FAECE7;color:#712B13;border-color:#F0997B}
  .th-c{background:#FBEAF0;color:#72243E;border-color:#ED93B1}
  .th-casa{background:#E1F5EE;color:#085041;border-color:#5DCAA5}
  .th-yoga{background:#EAF3DE;color:#27500A;border-color:#97C459}
  .th-esc{background:#F1EFE8;color:#444441;border-color:#B4B2A9}
  .th-am{background:#FAEEDA;color:#633806;border-color:#EF9F27}
  .linkcard{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:12px 14px;margin-bottom:10px}
  .linkcard .arrow{font-size:20px;font-weight:400}
  .navcard{border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;border:1px solid}
  .navcard .ttl{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
  .navcard .rm{font-size:12.5px;font-weight:600;margin-top:5px}
  .lastday{font-size:12px;color:var(--muted);margin-bottom:4px}
  .form.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .fb{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
  .fb .ok{color:var(--ok)} .fb .wa{color:#9a5b12}
  .ulink{display:block;width:100%;background:none;border:none;text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:700;color:var(--ink);margin-top:10px;cursor:pointer}
  .rhead{border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid}
  .rhead .rt{font-weight:800;font-size:15px}
  .rhead .rm{font-size:12.5px;margin-top:6px;line-height:1.55;opacity:.9}
  /* Home y Entrenamiento: menú en lista */
  .hdate{font-size:13px;color:var(--muted);font-weight:600;margin:2px 2px 2px;text-transform:none}
  .hcic{font-size:12.5px;color:#993556;font-weight:600;margin:0 2px 12px;cursor:pointer}
  .menu{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .mrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
  .mrow:first-child{border-top:none}
  .mrow:active{background:var(--cream)}
  .mic{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .mic svg{width:21px;height:21px}
  .mtx{flex:1;min-width:0}
  .mt{font-weight:700;font-size:15px}
  .ms{font-size:12.5px;color:var(--muted);margin-top:1px}
  .chev{color:var(--muted);font-size:20px;flex:0 0 auto}
  .hoyrow{background:#FAEEDA;border-color:#EF9F27}
  .hoyrow .mrow{padding:9px 12px}
  .hoyrow .mt{font-size:14px;color:#633806}
  .hoyrow .ms{color:#854F0B}
  .hoyrow .mic{background:#fff}
  .ic-coral{background:#FAECE7;color:#993C1D} .ic-green{background:#EAF3DE;color:#3B6D11} .ic-teal{background:#E1F5EE;color:#0F6E56}
  .ic-gray{background:#F1EFE8;color:#5F5E5A} .ic-pink{background:#FBEAF0;color:#993556} .ic-purple{background:#EEEDFE;color:#534AB7}
  .ic-amber{background:#FAEEDA;color:#854F0B} .ic-blue{background:#E6F1FB;color:#185FA5}
  .ehead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .pill{border:1px solid #EF9F27;background:#FAEEDA;color:#633806;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
  .kest{margin-top:12px;font-size:13.5px;color:var(--terra-dark);text-align:center}
  .kmeta{margin-top:8px;background:#FAEEDA;color:#633806;border-radius:10px;padding:9px 12px;font-size:14px}
  .ksum{margin:8px 0}
  .kbig{font-size:30px;font-weight:800;color:var(--terra-dark)}
  nav.back{justify-content:flex-start;padding:10px 10px 6px}
  nav .backlink{background:none!important;color:var(--ink)!important;border:none;padding:4px 6px;font-size:15px;font-weight:800;cursor:pointer}
  .hoycard{background:#FAEEDA;border:1px solid #EF9F27;border-radius:14px;padding:11px 13px;margin-bottom:12px;color:#633806;cursor:pointer}
  .hoycard .ht{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
  .hoycard .ht svg{width:20px;height:20px;flex:0 0 auto}
  .hoycard .hs{font-size:12.5px;color:#854F0B;margin-top:4px}
  .hoycard .hb{display:block;width:100%;margin-top:9px;border:none;border-radius:10px;background:#633806;color:#FAEEDA;font-weight:700;font-size:13px;padding:8px;cursor:pointer}
  .wi{display:inline-flex;vertical-align:-3px;margin-right:7px;background:none!important}
  .wi svg{width:17px;height:17px}
  .exbtns{display:flex;gap:5px;align-items:center;flex:0 0 auto}
  .edsm{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 7px;font-size:11px;cursor:pointer;line-height:1.3}
  .edsm.done{align-self:flex-end;background:#FAEEDA;border-color:#EF9F27;color:#633806;font-weight:700;font-size:12.5px;padding:6px 12px}
  .addsm{display:block;width:100%;background:none;border:none;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px;padding:9px;cursor:pointer}
  .ptip{font-size:12.5px;color:var(--teal);margin:0 2px 14px}
  .ptip b{color:var(--teal)}
  .yvid{position:relative;display:block;border-radius:12px;overflow:hidden;background:#000}
  .yvid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.92}
  .yvid span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .yt{font-weight:700;font-size:14px;margin-top:8px}
  details.item .ibody li{margin:5px 0}
  /* iPhone: los campos de fecha y hora tienen un ancho mínimo propio y se salían de su columna */
  .form label{min-width:0}
  .form input[type=date],.form input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:40px;text-align:left}
  .form input::-webkit-date-and-time-value{text-align:left}
  .tedit{display:flex;gap:8px;align-items:flex-end;margin-top:8px;flex-wrap:wrap}
  .tedit label{flex:1 1 90px;min-width:0;font-size:11px;color:var(--muted);font-weight:600}
  .tedit input{display:block;width:100%;min-width:0;-webkit-appearance:none;appearance:none;margin-top:3px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:14px;font-family:inherit;background:var(--cream);color:var(--ink);min-height:38px}
  .hsave{border:none;border-radius:9px;background:var(--terra);color:#fff;font-weight:700;padding:10px 14px;cursor:pointer}
  .fsum{margin-top:10px}
  .flegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px}
  .flegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .flegend i.lm{width:14px;height:0;border-top:2.5px solid #2c2723;border-radius:0;vertical-align:middle}
  .flegend i.lg{width:14px;height:0;border-top:2px dashed #2f7d78;border-radius:0;vertical-align:middle}
  .seg.sel{flex-wrap:wrap}
  .seg.sel button{flex:1 1 40%;font-size:12px}
  .toca{background:#EAF3DE;color:#27500A;border:1px solid #97C459;border-radius:12px;padding:8px 12px;font-size:12.5px;margin:-6px 0 12px}
  .toca.otra{background:#fff;color:var(--ink);border-color:var(--line)}
  .tag{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;vertical-align:2px}
  .tag.prioridad{background:#EEEDFE;color:#3C3489}
  .tag.juego{background:#E1F5EE;color:#085041}
  .altlink{display:block;margin-top:6px;border:1px dashed #EF9F27;background:#fffaf4;color:#633806;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer}
  .pbar{height:6px;background:#f1ebe2;border-radius:4px;margin:0 0 6px}
  .pbar div{height:6px;border-radius:4px}
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;border:none;background:var(--sand);color:var(--ink);
    padding:9px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  nav button.active{background:var(--terra);color:#fff}
  nav button.yoga.active{background:var(--teal)}

  main{padding:8px 14px 20px}
  .introbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
  .intro{font-size:12px;color:var(--muted);flex:1}
  .editbtn{flex:0 0 auto;border:1px solid var(--terra);background:#fff;color:var(--terra);
    font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;cursor:pointer}
  .editbtn.on{background:var(--terra);color:#fff}

  .block{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:1px solid var(--line)}
  .block-h{padding:11px 14px;font-size:13px;font-weight:700;color:var(--terra);background:var(--sand);letter-spacing:.3px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .yoga .block-h{color:var(--teal)}
  .block-h input{flex:1;font:inherit;font-size:13px;font-weight:700;text-transform:uppercase;color:var(--terra);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
  .ex{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-top:1px solid var(--line)}
  .ex:first-child{border-top:none}
  .cbx{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;margin-top:1px;background:#fff}
  .cbx.on{background:var(--ok);border-color:var(--ok)}
  .cbx.on::after{content:"✓";color:#fff;font-size:15px;font-weight:800}
  .ex-body{flex:1;min-width:0}
  .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ex-name{font-size:14.5px;font-weight:600}
  .info{flex:0 0 auto;border:none;background:var(--teal-light);color:var(--teal);font-size:12px;font-weight:700;border-radius:14px;padding:4px 9px;cursor:pointer}
  .ex-dose{font-size:12px;color:var(--muted);margin-top:1px}
  .last{font-size:11.5px;color:var(--teal);margin-top:4px}
  .up{font-size:11.5px;color:var(--terra-dark);font-weight:700;margin-top:2px}
  .ex-note{margin-top:7px;display:flex;gap:6px}
  .ex-note input{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;
    background:var(--cream);color:var(--ink);font-family:inherit;min-width:0;
  }
  .ex-note input.kg{flex:0 0 78px}
  .ex-note input:focus{outline:none;border-color:var(--terra);background:#fff}
  .star{color:var(--terra);font-size:11px}

  /* Registro de series con botones */
  .sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1.5px dashed var(--line);background:#fff;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .chip.done{background:var(--ok);color:#fff;border:1.5px solid var(--ok)}
  .chip.next{border:1.5px solid var(--terra);color:var(--terra)}
  .setrow{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
  .setrow label{flex:0 0 70px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .setrow input{display:block;width:100%;margin-top:2px;border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;font-size:17px;font-weight:800;text-align:center;font-family:inherit;background:#fff;color:var(--ink)}
  .setrow input:focus{outline:none;border-color:var(--terra)}
  .play{flex:0 0 auto;border:none;border-radius:10px;padding:10px 11px;font-size:13px;font-weight:800;background:var(--teal);color:#fff;cursor:pointer}
  .playsm{margin-top:6px;border:none;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:800;background:var(--teal-light);color:var(--teal);cursor:pointer}
  .logset{flex:1;border:none;border-radius:10px;padding:11px 8px;font-size:14px;font-weight:800;background:var(--terra);color:#fff;cursor:pointer;white-space:nowrap}
  .logset.extra{background:var(--sand);color:var(--ink);font-size:13px}
  .ex.active{background:#fffaf4}
  .hbtns{display:flex;gap:6px;align-items:center}
  .hlink{background:none;border:none;color:var(--teal);font-size:12px;font-weight:700;cursor:pointer;padding:4px}
  .ccard{background:#FBEAF0;color:#72243E;border:1px solid #ED93B1;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.45;cursor:pointer}
  .ccard .ct{font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;margin-bottom:3px}
  .cbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-top:6px}
  .cpos{position:relative;height:14px;font-size:11px}
  .cpos span{position:absolute;transform:translateX(-50%)}
  .clegend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);flex-wrap:wrap;gap:4px}
  .rhead .cl{margin-top:8px;padding-top:7px;border-top:1px dashed currentColor;font-weight:600}
  .elapsed{font-size:12.5px;color:var(--teal);margin:-6px 2px 12px}
  .edcard{border-top:1px solid var(--line);padding:11px 14px;display:flex;flex-direction:column;gap:8px}
  .edtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px}
  .mv{display:flex;gap:4px;flex:0 0 auto}
  .mv button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:30px;height:30px;font-size:14px;cursor:pointer}
  .block-h .mv button{height:26px;min-width:26px;font-size:12px}
  .edtype{display:flex;align-items:center;gap:10px}
  .typ{background:#FAEEDA;color:#633806;border:1px solid #EF9F27;border-radius:14px;padding:3px 10px;font-weight:700;font-size:12px}
  .edlink{background:none;border:none;text-decoration:underline;color:var(--muted);font-size:12.5px;cursor:pointer;padding:2px 4px}
  .edlink.danger{color:#c0392b}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip2{border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
  .chip2.on{background:#FAEEDA;color:#633806;border-color:#EF9F27;font-weight:700}
  .edgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .edgrid label,.edfull{font-size:11px;color:var(--muted);font-weight:600;display:block}
  .edgrid input,.edfull input,.edfull select,.edfull textarea{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:14px;font-family:inherit;background:var(--cream);color:var(--ink)}
  .edfull{margin-top:6px}
  .edcheck{font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--ink)}
  .addcard{background:#fffaf4}
  .addgo{width:100%}
  .libact{display:flex;justify-content:space-between;margin-top:10px}
  .curlv{background:#FAEEDA;border-radius:6px;padding:2px 6px}
  .lvrow{display:grid;grid-template-columns:14px minmax(0,1.6fr) 46px 72px 50px 28px;gap:4px;align-items:center;margin-top:5px;font-size:12px}
  .lvrow input,.lvrow select{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 5px;font-size:13px;font-family:inherit;background:var(--cream);color:var(--ink);min-width:0}
  .lvlwrap{display:block;margin-top:6px;font-size:11px;font-weight:700;color:#633806}
  .lvup{display:block;width:100%;margin-top:6px;border:1px solid #EF9F27;background:#FAEEDA;color:#633806;border-radius:10px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
  .lvl{margin-top:3px;width:100%;border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;font-family:inherit;background:#FAEEDA;color:#633806;border-color:#EF9F27;font-weight:700;font-size:13px;padding:8px}

  /* Edición */
  .ed-row{display:flex;flex-direction:column;gap:6px;flex:1}
  .ed-row input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--cream);color:var(--ink)}
  .ed-row input:focus{outline:none;border-color:var(--terra);background:#fff}
  .ed-opts{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .ed-opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .trash{flex:0 0 auto;background:none;border:none;font-size:18px;cursor:pointer;padding:2px 4px;margin-top:2px}
  .addex{width:100%;border:1px dashed var(--terra);background:#fff;color:var(--terra);font-weight:700;
    font-size:13px;padding:10px;cursor:pointer;border-top:1px solid var(--line)}
  .addblock{width:100%;border:1px dashed var(--muted);background:#fff;color:var(--muted);font-weight:700;
    font-size:13px;padding:12px;cursor:pointer;border-radius:14px;margin-bottom:14px}
  .restore{width:100%;background:none;border:none;color:#c0392b;font-size:12px;padding:10px;cursor:pointer;text-decoration:underline}

  .save{
    position:fixed;left:14px;right:84px;bottom:16px;z-index:30;
    background:var(--terra);color:#fff;border:none;border-radius:14px;padding:15px;
    font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(160,79,47,.35);cursor:pointer;
  }
  .save:active{transform:scale(.99)}
  .save.yoga{background:var(--teal);box-shadow:0 4px 16px rgba(47,125,120,.35)}

  .hitem{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:12px 14px;margin-bottom:10px}
  .hitem-h{display:flex;justify-content:space-between;align-items:center}
  .hitem-t{font-weight:700;font-size:14px}
  .hitem-d{font-size:12px;color:var(--muted)}

  {n:"Calentamiento de muñecas", d:"1 min"},
  {n:"Retracción escapular colgada", d:"1 × 8"},
  {n:"Flexiones de escápula", d:"1 × 10"},

]};}

]};}

  "Gato-vaca y círculos de hombros":{v:"NVNoJph0fw0",cat:"Calentamiento",musc:"Columna y hombros",
    pasos:["En cuatro apoyos: al inhalar hunde la espalda y mira adelante (vaca).","Al exhalar redondea la espalda y mira al ombligo (gato).","Luego de pie, círculos grandes de hombros hacia adelante y atrás."],fij:["Lento, siguiendo la respiración."],err:["Forzar el cuello."],q:"gato vaca yoga"},
  "Movilidad de cadera y pike":{v:"",cat:"Calentamiento",musc:"Caderas e isquiotibiales",
    pasos:["Sentada con piernas estiradas (pike), inclínate adelante con la espalda larga 30 seg.","Piernas abiertas (pancake), inclínate adelante 30 seg.","Termina con círculos de cadera de pie."],fij:["Prepara la compresión, el L-sit y las figuras."],err:["Rebotar para llegar más lejos."],q:"movilidad pike pancake calistenia"},
  "L en la pared":{v:"nsJwFasDayE",cat:"Handstand",musc:"Hombros, tríceps, core y línea del cuerpo",skill:true,lvlDefault:0,
    niveles:[
      {n:"Pies en la pared, cuerpo en L",d:"3 × 15-20 seg"},
      {n:"Una pierna arriba (alternando)",d:"3 × 10 seg c/pierna"},
      {n:"Despegar los dos pies 1-2 seg",d:"5 intentos"},
    ],
    pasos:["Siéntate con la espalda a la pared y marca dónde quedan tus pies: ahí van las manos.","Ponte en cuatro apoyos mirando hacia afuera, con las manos en esa marca.","Sube los pies por la pared hasta la altura de la cadera: el cuerpo queda en L.","Lleva los hombros justo sobre las manos y empuja el suelo. Desde ahí levanta una pierna hasta arriba."],
    fij:["Hombros sobre las manos: todo el peso en las manos.","Un pie siempre puede volver a la pared: ideal para perderle el miedo a la vertical.","Prepara el pike push-up en L y el handstand libre."],
    err:["Manos muy lejos de la pared (los hombros quedan atrás).","Espalda redonda o hundida."],q:"handstand L pared drill"},
  "Handstand de espalda a la pared":{v:"f863Cv5eoxk",cat:"Handstand",musc:"Equilibrio, hombros y core",skill:true,lvlDefault:0,
    niveles:[
      {n:"Subir con patada y quedarse con los talones apoyados",d:"5 × 10-20 seg"},
      {n:"Despegar un talón por momentos",d:"5 intentos"},
      {n:"Despegar los dos talones y buscar el equilibrio",d:"5-8 intentos"},
    ],
    pasos:["Manos a un palmo de la pared, mirando hacia ella.","Sube con una patada suave y apoya los talones en la pared.","Empuja el suelo, junta las piernas y mete las costillas.","Despega los talones con los dedos de las manos haciendo fuerza (como frenando) y vuelve a apoyar."],
    fij:["Los dedos de las manos corrigen el equilibrio: si te vas hacia la pared, presiona con los dedos.","Practica la salida en rueda antes."],
    err:["Manos muy lejos (el cuerpo queda en banana).","Patear muy fuerte."],q:"handstand espalda a la pared despegar talones"},
  "Pateos al centro con salida en rueda":{v:"EIun1feCQrc",cat:"Handstand",musc:"Equilibrio y técnica de entrada",
    pasos:["En un lugar con espacio (o sobre pasto o colchoneta).","Manos al suelo, una pierna adelante: patea suave con la de atrás hasta casi vertical.","Busca el equilibrio un instante.","Si te pasas, suelta una mano y sal en rueda hacia el lado."],
    fij:["Patadas suaves: es mejor quedarse corta que pasarse.","La salida en rueda te da seguridad: practícala hacia ambos lados."],
    err:["Patear con la pierna doblada.","Mirar hacia los pies."],q:"patada a handstand kick up técnica"},
  "Pike push-up":{v:"66x0qQiJ-MA",cat:"Calistenia",musc:"Hombros y tríceps (camino al handstand push-up)",skill:true,lvlDefault:0,
    niveles:[
      {n:"V invertida: mantener con los hombros sobre las manos",d:"3 × 20-30 seg"},
      {n:"Pike push-up desde rodillas",d:"3 × 6-8"},
      {n:"Rango corto (bajar hasta un cojín alto)",d:"3 × 5-8"},
      {n:"Negativas (bajar en 3-5 seg, subir con las rodillas)",d:"3 × 4-6"},
      {n:"Pike push-up completo",d:"3 × 5-8"},
      {n:"Pies elevados o en L en la pared",d:"3 × 4-6"},
    ],
    pasos:["Cadera alta como una V invertida, manos al ancho de hombros, dedos abiertos.","Camina los pies hacia las manos hasta que los hombros queden lo más arriba posible.","Dobla los codos y baja la cabeza hacia el suelo, un poco delante de las manos (la cabeza y las manos forman un triángulo).","Empuja de vuelta hasta estirar los brazos."],
    fij:["Codos hacia atrás (en diagonal), no abiertos hacia los lados.","Cadera alta todo el tiempo.","Es la fuerza que necesitas para el handstand."],
    err:["Bajar la cadera y convertirlo en una flexión normal.","Codos abiertos hacia los lados."],
    codo:"Lento y sin llegar al fallo. Si sientes chasquido o dolor, vuelve al nivel anterior.",q:"pike push up progresiones principiantes"},
  "Cuervo":{v:"Vu03oh_kXKQ",cat:"Handstand",musc:"Equilibrio sobre las manos, hombros, muñecas y abdomen",skill:true,lvlDefault:1,
    niveles:[
      {n:"Cuervo con los pies sobre un bloque",d:"5 × 5-10 seg"},
      {n:"Cuervo",d:"5 × 10-20 seg"},
      {n:"Cuervo con un pie arriba",d:"4 × 5 seg c/lado"},
      {n:"Cuervo → cabeza apoyada (trípode) y volver",d:"3-5 intentos"},
    ],
    pasos:["En cuclillas, manos al ancho de hombros con los dedos abiertos.","Dobla un poco los codos y apoya las rodillas en la parte de atrás de los brazos, lo más arriba posible.","Mira un poco adelante e inclínate hasta que los pies se despeguen.","Para ir a cabeza apoyada: baja la frente adelante formando un triángulo con las manos y sube las caderas; vuelve al cuervo."],
    fij:["Pon un cojín delante de la cara para perder el miedo.","Aprieta las rodillas contra los brazos y mete el ombligo."],
    err:["Mirar hacia abajo (te vas de cara).","Codos muy abiertos."],q:"bakasana cuervo tutorial"},
  "Koundinyasana II":{v:"NT2CvAV1CUQ",cat:"Handstand",musc:"Equilibrio, hombros, abdomen y oblicuos",skill:true,lvlDefault:0,
    niveles:[
      {n:"Cuervo lateral (piernas recogidas)",d:"4 × 5-10 seg c/lado"},
      {n:"Pierna de adelante estirada sobre el brazo",d:"4 × 5 seg c/lado"},
      {n:"Las dos piernas estiradas (Eka Pada Koundinyasana II)",d:"3 × 3-5 seg c/lado"},
    ],
    pasos:["Desde una estocada baja, pasa el brazo por dentro de la pierna de adelante y apoya la mano en el suelo.","Apoya el muslo de adelante sobre la parte de atrás del brazo, bien arriba.","Inclínate adelante con los codos doblados (como en el cuervo) hasta que el peso pase a las manos.","Estira la pierna de adelante sobre el brazo y luego la de atrás."],
    fij:["Primero domina el cuervo lateral.","Mira adelante, no abajo.","Un bloque bajo el pie de atrás ayuda al principio."],
    err:["Muslo apoyado muy abajo del brazo.","Hundir el hombro."],
    codo:"Codos en 90° y alineados con las muñecas.",q:"eka pada koundinyasana 2 tutorial"},
  "Elbow lever":{v:"NxjcbJZnoGQ",cat:"Calistenia",musc:"Abdomen, hombros, muñecas y equilibrio",skill:true,lvlDefault:0,
    niveles:[
      {n:"Inclinarse con los pies en el suelo",d:"3 × 10-15 seg"},
      {n:"Un pie arriba",d:"3 × 5-10 seg"},
      {n:"Piernas recogidas",d:"3 × 5-10 seg"},
      {n:"Elbow lever completo",d:"3 × 5-10 seg"},
    ],
    pasos:["En tus paralelas de piso (más fácil que en el suelo), manos con los dedos hacia los pies.","Apoya los codos en la cadera, a los lados del ombligo.","Inclínate hacia adelante hasta que el peso pase a las manos y los pies se despeguen.","Cuerpo recto y apretado; mira al frente."],
    fij:["En yoga se parece al pavo real (Mayurasana).","Avanza de a poco: carga bastante las muñecas."],
    err:["Codos separados del cuerpo.","Doblar la cadera."],
    codo:"Si molesta el codo o la muñeca, vuelve al nivel anterior.",q:"elbow lever tutorial principiantes"},
  "Elevación de piernas en barra":{v:"naR7Qldgxrg",cat:"Abdomen",musc:"Recto abdominal bajo y flexores de cadera",rec:{tipo:"reps",sets:3,val:"8-10",rest:60},
    pasos:["Cuélgate de tu barra de casa con las rodillas dobladas (como la barra es baja, los pies quedan atrás o despegados del suelo).","Sube las rodillas hacia el pecho enrollando la pelvis.","Baja lento sin balancearte."],
    fij:["El movimiento es de la pelvis: enrolla, no solo levantes las piernas.","Sin balanceo."],err:["Impulsarse.","Bajar de golpe."],q:"elevación de rodillas colgado barra"},
  "Plancha lateral":{v:"zfiOU4yxLKo",cat:"Abdomen",musc:"Oblicuos y glúteo medio",rec:{tipo:"seg",sets:2,val:"20-30",rest:30},
    pasos:["De lado, apoyada en el antebrazo (codo bajo el hombro).","Sube la cadera hasta que el cuerpo quede recto de cabeza a pies.","Mantén y cambia de lado."],fij:["Cadera arriba y adelante, no hacia atrás."],err:["Dejar caer la cadera."],q:"plancha lateral técnica"},
  "Rodillas al pecho en paralelas":{v:"uxQRhxeXSHI",cat:"Abdomen",musc:"Abdomen, flexores de cadera y hombros (camino al L-sit)",rec:{tipo:"reps",sets:3,val:"8",rest:45},
    pasos:["En tus paralelas de piso, brazos estirados y hombros empujando hacia abajo.","Despega los pies y sube las rodillas al pecho.","Baja lento hasta casi tocar el suelo y repite."],fij:["Hombros lejos de las orejas."],err:["Hundir los hombros."],q:"tuck raises paralelas L-sit"},
  "Hollow rocks":{v:"tWZBamV2tjc",cat:"Abdomen",musc:"Abdomen completo",rec:{tipo:"reps",sets:2,val:"15",rest:45},
    pasos:["En posición de hollow (espalda baja pegada al suelo, brazos y piernas estirados y despegados).","Mécete adelante y atrás como un balancín sin perder la forma."],fij:["Si se despega la espalda baja, dobla un poco las rodillas."],err:["Arquear la espalda."],q:"hollow rocks tutorial"},
  "Escaladores lentos":{v:"FPLXxBxYcmE",cat:"Circuito",musc:"Abdomen, hombros y pulso",
    pasos:["En plancha alta, lleva una rodilla al pecho y vuelve.","Alterna con la otra, a ritmo constante y sin saltar."],fij:["Cadera baja y hombros sobre las manos."],err:["Levantar mucho la cadera."],q:"mountain climbers técnica"},
  "Step jacks":{v:"jI_1-O4L2dQ",cat:"Circuito",musc:"Cuerpo completo (sube el pulso sin impacto)",
    pasos:["De pie: abre un pie hacia el lado mientras subes los brazos.","Vuelve al centro y abre el otro pie.","Rápido pero sin saltar."],fij:["Cuida la rodilla: sin saltos."],err:["Saltar."],q:"jumping jack sin salto"},
  "Sentadilla con peso corporal":{v:"qsAkuNORgmk",cat:"Circuito",musc:"Piernas y glúteos",
    pasos:["Pies al ancho de hombros, un poco abiertos.","Baja como si te sentaras atrás, con el pecho arriba.","Sube empujando el suelo."],fij:["Baja solo hasta donde la rodilla esté cómoda."],err:["Rodillas hacia adentro."],q:"sentadilla técnica correcta"},
  "Plancha con toques de hombro":{v:"7o-EHYhFcl8",cat:"Circuito",musc:"Abdomen, hombros y estabilidad",
    pasos:["En plancha alta con los pies algo separados.","Toca el hombro contrario con una mano, sin mover la cadera.","Alterna."],fij:["Cadera quieta: que no se balancee."],err:["Girar la cadera."],q:"plancha con toques de hombro"},
  "Puente de glúteo":{v:"oDXM-a-gBt8",cat:"Circuito",musc:"Glúteos y femorales",
    pasos:["Boca arriba, rodillas dobladas y pies apoyados.","Sube la cadera apretando los glúteos hasta formar una línea recta.","Baja lento."],fij:["Empuja con los talones."],err:["Arquear la espalda baja."],q:"puente de glúteo técnica"},

  /* Piernas */
  "Prensa de piernas":{v:"xvCynwyNoP4",cat:"Piernas",musc:"Cuádriceps y glúteos",
    pasos:["Espalda y cadera bien apoyadas en el respaldo.","Pies en el centro de la plataforma, al ancho de las caderas, puntas levemente hacia afuera.","Empuja un poco la plataforma y suelta los seguros (manillas de los lados).","Baja lento (2-3 seg) hasta unos 90° de rodilla o hasta donde no haya dolor, sin que la cola se despegue.","Empuja con todo el pie hasta casi estirar las piernas.","Al terminar la serie, vuelve a poner los seguros."],
    fij:["Rodillas en línea con las puntas de los pies.","La máquina de 45° ya pesa sola (el carro): parte con poco peso."],
    err:["Bloquear las rodillas arriba.","Bajar tanto que la pelvis se despega."],
    rod:"Pies más arriba en la plataforma = menos carga en la rodilla y más glúteo.",q:"prensa de piernas 45 grados técnica correcta"},
  "Extensión de cuádriceps":{v:"GwkdX6k9314",cat:"Piernas",musc:"Cuádriceps",
    pasos:["Ajusta el respaldo para que la rodilla quede alineada con el eje de giro de la máquina.","El rodillo va en la parte baja de la tibia, justo sobre el tobillo.","Tómate de las manillas y apoya bien la cola.","Estira las piernas en 1 seg y aprieta arriba 1 seg.","Baja lento, en 3 seg."],
    fij:["Aquí manda el control, no los kilos."],
    err:["Balancear o dejar caer el peso.","Rodilla desalineada del eje."],
    rod:"Hecha lenta, es parte típica de la rehabilitación de la tendinosis rotuliana. Si hay dolor punzante: solo la mitad de arriba del recorrido o sostener arriba 30-45 seg.",q:"extensión de cuádriceps en máquina técnica"},
  "Abductores en máquina":{v:"-g5AF8wA740",cat:"Piernas",musc:"Glúteo medio y menor",
    pasos:["Siéntate con la espalda apoyada y las almohadillas por fuera de las rodillas.","Abre las piernas empujando hacia afuera todo lo que puedas.","Sostén 1 seg y vuelve lento, sin que las placas choquen."],
    fij:["Inclinarte un poco adelante carga más el glúteo.","Estabiliza la rodilla: evita que se vaya hacia adentro."],
    err:["Rebotar.","Recorrido a medias."],q:"máquina de abductores técnica glúteo medio"},
  "Peso muerto con barra hexagonal":{v:"FcMwHOyaZYU",cat:"Piernas",musc:"Glúteos, cuádriceps, femorales y espalda",
    pasos:["Párate al centro de la barra hexagonal, pies al ancho de las caderas, con las manillas alineadas con la mitad del pie.","Lleva la cadera atrás y dobla las rodillas hasta tomar las manillas por el centro.","Pecho arriba, espalda recta, brazos estirados; toma aire y aprieta el abdomen.","Empuja el suelo con las piernas y ponte de pie: cadera y rodillas se estiran al mismo tiempo.","Arriba, quédate erguida sin echarte hacia atrás.","Baja llevando primero la cadera atrás y luego doblando las rodillas, con control."],
    fij:["Más fácil de aprender y más amable con la espalda que el peso muerto con barra recta.","Si la barra tiene manillas altas, úsalas al principio: el recorrido es más corto."],
    err:["Redondear la espalda.","Que la cadera suba antes que el pecho (se convierte en un peso muerto de espalda).","Echarte hacia atrás arriba."],
    rod:"Flexiona la rodilla más que el rumano: trabaja en el rango sin dolor y usa las manillas altas si molesta.",q:"peso muerto con barra hexagonal trap bar técnica"},
  "Hip thrust":{v:"efe-QObKAZU",cat:"Piernas",musc:"Glúteos",
    pasos:["Espalda apoyada en el borde largo de un banco plano, justo bajo las escápulas.","Barra (con protector) sobre el pliegue de la cadera, o una mancuerna. Si hay máquina de hip thrust, úsala.","Pies al ancho de las caderas, a una distancia en que arriba las canillas queden verticales.","Empuja con los talones y sube hasta que hombros, cadera y rodillas queden en línea.","Aprieta los glúteos 1 seg arriba y baja controlado."],
    fij:["Mentón levemente hacia el pecho, mirada al frente."],
    err:["Arquear la espalda baja arriba.","Pies muy lejos o muy cerca."],
    rod:"Muy amable con la rodilla.",q:"hip thrust con barra técnica correcta"},
  "Curl femoral":{v:"9xbBr5Ytl8c",cat:"Piernas",musc:"Femorales",
    pasos:["Máquina acostada (boca abajo) o sentada.","Rodilla alineada con el eje de giro.","Rodillo en la parte baja de la pantorrilla, justo sobre el talón.","Dobla las rodillas llevando los talones hacia la cola; aprieta 1 seg.","Baja lento (2-3 seg)."],
    fij:["Unos femorales fuertes protegen la rodilla."],
    err:["Levantar la cadera.","Soltar el peso de golpe."],q:"curl femoral en máquina técnica"},
  "Step-up a cajón con mancuernas":{v:"CpKJ1B4iNwc",cat:"Piernas",musc:"Glúteos y cuádriceps, una pierna a la vez",
    pasos:["Cajón o banco bajo (30-40 cm): al apoyar el pie arriba, la rodilla no debe quedar más alta que la cadera.","Una mancuerna en cada mano, brazos a los lados.","Apoya el pie completo en el cajón.","Empuja con el talón de esa pierna hasta quedar de pie y estirada arriba; la pierna de abajo solo acompaña.","Baja controlado con la misma pierna. Termina las repeticiones y cambia de pierna."],
    fij:["Rodilla en línea con el pie.","Tronco un poco inclinado adelante = más glúteo."],
    err:["Impulsarte con la pierna de abajo.","Cajón demasiado alto al principio."],
    rod:"Mientras más bajo el cajón, menos flexión de rodilla.",q:"step up con mancuernas técnica"},
  "Peso muerto rumano con mancuernas":{v:"yxLk9X5C7RU",cat:"Piernas",musc:"Femorales, glúteos y espalda baja",
    pasos:["De pie, pies al ancho de caderas, mancuernas delante de los muslos.","Rodillas levemente dobladas y así se quedan.","Lleva la cadera hacia atrás mientras las mancuernas bajan rozando las piernas.","Baja hasta sentir el estiramiento atrás del muslo (en general, un poco bajo la rodilla) sin perder la espalda recta.","Sube empujando la cadera adelante y apretando los glúteos."],
    fij:["Es una bisagra de cadera, no una sentadilla."],
    err:["Redondear la espalda.","Doblar mucho las rodillas.","Alejar las mancuernas del cuerpo."],
    rod:"La rodilla casi no se flexiona.",q:"peso muerto rumano con mancuernas técnica"},

  /* Abdomen */
  "Crunch en polea":{v:"ui3iEsYbXtI",cat:"Abdomen",musc:"Recto abdominal (las 'calugas')",
    pasos:["Polea alta con cuerda. Arrodíllate mirando la polea, a unos 50 cm.","Manos con la cuerda a los lados de la cabeza.","Enrolla la columna llevando los codos hacia los muslos, como mirándote el ombligo.","Vuelve lento hasta estirar el abdomen."],
    fij:["La cadera se queda quieta.","Exhala fuerte al bajar."],
    err:["Tirar con los brazos.","Sentarte hacia atrás sobre los talones."],q:"crunch en polea alta de rodillas técnica"},
  "Elevación de piernas colgada":{v:"i7StVAy8RCk",cat:"Abdomen",musc:"Recto abdominal y flexores de cadera",
    pasos:["Cuélgate de la barra, palmas hacia adelante, al ancho de los hombros.","Baja los hombros, alejándolos de las orejas.","Sin balancearte, sube las rodillas al pecho y 'enrolla' la pelvis (la cola va hacia adelante).","Baja lento (2-3 seg)."],
    fij:["Enrollar la pelvis es lo que trabaja el abdomen.","Progresión: rodillas al pecho → piernas estiradas a 90° → pies a la barra."],
    err:["Balancearse.","Subir las piernas sin enrollar la pelvis."],q:"elevación de piernas colgado en barra técnica abdomen"},
  "Plancha":{v:"d0atctiI7Vw",cat:"Abdomen",musc:"Recto abdominal y core completo",skill:true,
    niveles:[
      {n:"Plancha normal",d:"3 × 30-45 seg"},
      {n:"Plancha de máxima tensión",d:"3 × 20 seg"},
      {n:"Brazos adelantados (codos delante de los hombros)",d:"3 × 20-30 seg"},
      {n:"Levantando un brazo o una pierna (alternando)",d:"3 × 8 c/lado"},
      {n:"Plancha con desplazamiento (adelante-atrás)",d:"3 × 8"},
    ],
    pasos:["Antebrazos en el suelo, codos bajo los hombros.","Cuerpo en línea recta de cabeza a talones.","Aprieta glúteos y abdomen, y enrolla levemente la pelvis (la espalda baja no se hunde).","Respira sin soltar la tensión."],
    fij:["Máxima tensión: aprieta puños, glúteos, abdomen y muslos como si te fueran a empujar; dura menos pero trabaja más.","Desplazamiento: desde la plancha, mécete adelante y atrás sobre los antebrazos unos centímetros."],
    err:["Espalda baja hundida.","Cadera muy arriba."],q:"progresión plancha abdominal rkc plank"},
  "Oblicuos colgada":{v:"L1rt7qr5LCk",cat:"Abdomen",musc:"Oblicuos (costados del abdomen)",
    pasos:["Cuélgate de la barra con los hombros activos.","Sube las rodillas juntas hacia un lado, girando la pelvis, como si llevaras la cadera hacia la axila de ese lado.","Baja lento al centro y alterna los lados."],
    fij:["Lento, sin balanceo."],err:["Balancearse de lado a lado."],
    alt:"Si todavía cuesta colgada: tendida de espaldas, lleva las rodillas dobladas a un lado y al otro (limpiaparabrisas).",q:"elevación de rodillas oblicua colgado barra"},
  "Pallof press":{v:"o_CxFP4FJhA",cat:"Abdomen",musc:"Oblicuos y core profundo (resiste el giro)",
    pasos:["Polea a la altura del pecho, agarre simple.","De lado a la polea, a 1-2 pasos; pies al ancho de hombros, rodillas levemente dobladas.","Agarre con las dos manos pegado al pecho.","Estira los brazos al frente: la polea intenta girarte y tú NO te dejas.","Sostén 2 seg, vuelve al pecho. Termina y cambia de lado."],
    fij:["Cadera y hombros siempre mirando al frente."],err:["Girar el tronco hacia la polea."],q:"pallof press en polea técnica"},
  "Hollow hold":{v:"E58napCEGEw",cat:"Abdomen",musc:"Abdomen (la línea del handstand)",
    pasos:["Tendida boca arriba, pega la espalda baja al suelo.","Levanta hombros, brazos estirados sobre la cabeza y piernas estiradas unos centímetros del suelo, como un plátano.","Sostén sin que la espalda baja se despegue."],
    fij:["Si cuesta: rodillas dobladas o brazos a los lados."],err:["Espalda baja despegada del suelo."],q:"hollow body hold técnica"},

  /* Handstand en casa */
  "Perro boca abajo con empuje de hombros":{v:"k74aWiyQLrU",cat:"Handstand",musc:"Hombros y escápulas",
    pasos:["En perro boca abajo (V invertida), empuja el suelo con las manos.","Lleva los hombros hacia las orejas (empujando) y luego relájalos, sin doblar los codos.","10 repeticiones lentas."],fij:["Prepara el empuje de hombros del handstand."],err:["Doblar los codos."],q:"downward dog shoulder shrugs handstand prep"},

let LIB={};
// Biblioteca = base + lo que Diana crea/edita/borra (data.libEdits: {nombre: ficha, o null si la borró})
function buildLib(){LIB=Object.assign({},LIB_BASE);Object.entries(data.libEdits||{}).forEach(([n,e])=>{if(e===null)delete LIB[n];else LIB[n]=e;});}

const KEY="entreno_diana_v1";
// Bloque de entrenamiento actual: 8 semanas desde el lunes 5 oct 2026, meta 3 gym/semana. Al terminar, toca actualizar la rutina.
const BLOCK={start:"2026-10-05",weeks:8,goal:24};
const ROUTINES_VERSION=7;   // el plan v8 se aplica con la migración migV8 (cambios puntuales)
const APP_VERSION="versión 23 oct · plan v8";
function todayStr(){return dstr(new Date());}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
let data=load();
buildLib();
let currentTab="hoy";
let editMode=false;
let draft={};
let activeEx=null;   // ejercicio con el registro de series abierto
let cur={};          // valores kg/reps en pantalla por ejercicio
let sessionDate=todayStr();
let progSub="medidas";
let fotoPose="frente";

function load(){
  let d={};
  try{d=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
  if(!d.start)d.start=new Date().toISOString();
  if(!d.sessions)d.sessions=[];
  if(!d.medidas)d.medidas=[];
  if(!d.routines){d.routines=JSON.parse(JSON.stringify(DEFAULT_ROUTINES));d.routinesVersion=ROUTINES_VERSION;d.planStart=todayStr();}
  return d;
}
const SWAPS={"Caminadora inclinada":{n:"Bicicleta estática",d:"12 min · resistencia moderada"},
  "Abductores en máquina":{n:"Abducción acostada con mancuerna",d:"3 × 15 c/pierna"}};
const SWAPS2={"Peso muerto con barra hexagonal":{n:"Peso muerto con mancuernas",d:"3 × 8-10"}};
function checkRoutinesUpdate(){
  // El gimnasio no tiene caminadora ni máquina de abductores: se reemplazan en las rutinas guardadas
  if(!data.migSwaps){Object.values(data.routines).forEach(R=>R.blocks.forEach(bl=>bl.ex.forEach(ex=>{const w=SWAPS[ex.n];if(w&&!exInRoutine(R,w.n)){ex.n=w.n;ex.d=w.d;delete ex.tipo;}})));
    data.migSwaps=true;save();}
  if(!data.migSwaps2){Object.values(data.routines).forEach(R=>R.blocks.forEach(bl=>bl.ex.forEach(ex=>{const w=SWAPS2[ex.n];if(w&&!exInRoutine(R,w.n)){ex.n=w.n;ex.d=w.d;delete ex.tipo;}})));
    data.migSwaps2=true;save();}
  // Los colores/emojis de las rutinas se toman siempre del plan actual (sin tocar las ediciones de ejercicios)
  Object.keys(DEFAULT_ROUTINES).forEach(t=>{if(data.routines[t])data.routines[t].emoji=DEFAULT_ROUTINES[t].emoji;});
  // Rangos amplios (9 oct): solo cambia la dosis de estos ejercicios en las rutinas guardadas
  if(!data.migRanges){const RANGES={"Prensa de piernas":"3 × 8-15","Extensión de cuádriceps":"3 × 10-15","Peso muerto con mancuernas":"3 × 8-12","Hip thrust":"3 × 8-15"};
    ["gymA","gymB"].forEach(t=>{const R=data.routines[t];if(!R)return;R.blocks.forEach(bl=>bl.ex.forEach(ex=>{const r=RANGES[ex.n];if(!r||!ex.d)return;
      const p=parseDose(ex.d),m=r.match(/(\d+) × (.+)/);ex.d=buildDose(ex.tipo||"peso",{sets:+m[1],val:m[2],nota:p.nota,ss:p.ss});}));});
    if((data.routinesVersion||0)>=7){data.migRanges=true;save();}}
  // 10 oct: en Gym A el sit-up en el suelo pasa a banco declinado, hecho solo (no en superserie)
  if(!data.migDecl&&(data.routinesVersion||0)>=7){const R=data.routines.gymA;
    if(R&&!exInRoutine(R,"Abdominal en banco declinado"))R.blocks.forEach(bl=>bl.ex.forEach(ex=>{if(ex.n==="Sit-up con disco"){ex.n="Abdominal en banco declinado";ex.d="3 × 10-12";ex.tipo="peso";ex.rest=60;
      if(/superserie de 3/.test(bl.t))bl.t="🔥 Abdomen · banco + superserie de 2";}}));
    data.migDecl=true;save();}
  // 10 oct: en Gym B el banco declinado reemplaza al crunch inverso (idea de Diana)
  if(!data.migDeclB&&(data.routinesVersion||0)>=7){const R=data.routines.gymB;
    if(R&&!exInRoutine(R,"Abdominal en banco declinado"))R.blocks.forEach(bl=>bl.ex.forEach(ex=>{if(ex.n==="Crunch inverso"){ex.n="Abdominal en banco declinado";ex.d="3 × 10-12";ex.tipo="peso";ex.rest=60;
      if(/superserie de 3/.test(bl.t))bl.t="🔥 Abdomen · banco + superserie de 2";}}));
    data.migDeclB=true;save();}
  // 10 oct: a Diana le gustó el sit-up en el suelo → vuelve al Gym A; el banco declinado queda solo en el Gym B
  if(!data.migSitA&&(data.routinesVersion||0)>=7){const R=data.routines.gymA;
    if(R&&!exInRoutine(R,"Sit-up con disco"))R.blocks.forEach(bl=>bl.ex.forEach(ex=>{if(ex.n==="Abdominal en banco declinado"){ex.n="Sit-up con disco";ex.d="3 × 10 · superserie con la siguiente";ex.tipo="peso";delete ex.rest;
      if(/banco/.test(bl.t))bl.t="🔥 Abdomen · superserie de 3";}}));
    data.migSitA=true;save();}
  // 26 oct: plan v8 (gym = tren inferior + skill después de las máquinas; casa = tren superior en 3 versiones).
  // Cambios puntuales sobre sus rutinas guardadas (sin borrar sus ediciones); copia en data.routinesBackup2.
  if(!data.migV8){
    data.routinesBackup2=JSON.parse(JSON.stringify(data.routines));
    const fb=(R,re)=>R.blocks.findIndex(b=>re.test(b.t));
    const skillAfterLegs=R=>{const s=fb(R,/skill/i),p=fb(R,/piernas/i);if(s>=0&&p>=0&&s<p){const [bl]=R.blocks.splice(s,1);R.blocks.splice(fb(R,/piernas/i)+1,0,bl);}
      const s2=fb(R,/skill/i);if(s2>=0&&!/después/.test(R.blocks[s2].t))R.blocks[s2].t=R.blocks[s2].t.replace(/\s*\(5 min\)/,"")+" (después de las máquinas)";};
    const insertAfter=(R,after,ex)=>{if(exInRoutine(R,ex.n))return;for(const bl of R.blocks){const i=bl.ex.findIndex(e=>e.n===after);if(i>=0){bl.ex.splice(i+1,0,ex);return;}}};
    const optional=(R,remove,add)=>{let o=fb(R,/opcional/i);if(o<0){const c=fb(R,/cardio/i);R.blocks.splice(c>=0?c:R.blocks.length,0,{t:"➕ Opcional (si hay tiempo)",ex:[]});o=fb(R,/opcional/i);}
      const bl=R.blocks[o];bl.ex=bl.ex.filter(e=>e.n!==remove);add.forEach(x=>{if(!exInRoutine(R,x.n))bl.ex.push(x);});};
    const cardio=R=>{const c=fb(R,/cardio/i);if(c<0)return;R.blocks[c].t="🚴‍♀️ Cardio (opcional)";R.blocks[c].ex.forEach(e=>{if(e.n==="Bicicleta estática")e.d="8-10 min · opcional · resistencia moderada";});};
    const A=data.routines.gymA,B=data.routines.gymB;
    if(A){insertAfter(A,"Prensa de piernas",{n:"Pantorrillas en la prensa",d:"3 × 15 · al terminar la prensa, sin bajarte",log:true,tipo:"peso",rest:45});
      skillAfterLegs(A);optional(A,"Elevación de piernas colgada",[{n:"Skin the cat",skill:true,log:true,tag:"juego",rest:90}]);cardio(A);
      A.blocks.forEach(bl=>bl.ex.forEach(e=>{if(e.n==="Dominadas")e.tag="prioridad";}));}
    if(B){insertAfter(B,"Hip thrust",{n:"Sentadilla búlgara",d:"3 × 8 c/pierna",log:true,tipo:"peso",rest:90,alt:"Step-up a cajón con mancuernas"});
      skillAfterLegs(B);optional(B,"Oblicuos colgada",[{n:"Skin the cat",skill:true,log:true,tag:"juego",rest:90},{n:"Back lever",skill:true,log:true,tag:"juego",rest:90}]);cardio(B);}
    ["casa1","casa2","casa3","casaMini"].forEach(t=>{if(!data.routines[t])data.routines[t]=JSON.parse(JSON.stringify(DEFAULT_ROUTINES[t]));});
    data.migV8=true;save();}
  // 19 oct: una sola polea en el gym (siempre ocupada) → tríceps sobre la cabeza con mancuerna, con ficha completa
  if(!data.migTri){const T="Extensión de tríceps sobre cabeza con mancuernas";
    Object.values(data.routines).forEach(R=>R.blocks.forEach(bl=>bl.ex.forEach(ex=>{if(ex.n==="Extensión de tríceps en polea"&&!exInRoutine(R,T)){ex.n=T;ex.d="3 × 10-12";ex.tipo="peso";ex.log=true;ex.rest=60;}})));
    if(data.libEdits&&data.libEdits[T])delete data.libEdits[T];buildLib();
    data.migTri=true;save();}
  ESC.forEach(t=>{if(!data.routines[t]){data.routines[t]=JSON.parse(JSON.stringify(DEFAULT_ROUTINES[t]));save();}});
  if(!data.migYoga){YOGA.forEach(t=>{data.routines[t]=JSON.parse(JSON.stringify(DEFAULT_ROUTINES[t]));});data.migYoga=true;save();}
  // 11 oct: escalada sin bloque "A escalar"; en roca sin presas, sin chequeo y sin progresión
  if(!data.migEsc2){ESC.forEach(t=>{data.routines[t]=JSON.parse(JSON.stringify(DEFAULT_ROUTINES[t]));});data.migEsc2=true;save();}
  if((data.routinesVersion||0)<7){
    // Plan v7 (8 oct 2026): gimnasio = piernas + abdomen en 2 rutinas. Historial, medidas, Fitia, niveles y biblioteca no se tocan.
    data.routinesBackup=JSON.parse(JSON.stringify(data.routines));
    ["gymA","gymB"].forEach(t=>{data.routines[t]=JSON.parse(JSON.stringify(DEFAULT_ROUTINES[t]));});
    delete data.routines.gymC;
    if(!data.routines.casa)data.routines.casa=JSON.parse(JSON.stringify(DEFAULT_ROUTINES.casa));
    else{const C=data.routines.casa;C.nombre=DEFAULT_ROUTINES.casa.nombre;
      if(!exInRoutine(C,"Flexiones"))C.blocks.splice(Math.max(0,C.blocks.length-1),0,{t:"💪 Flexiones",ex:[{n:"Flexiones",skill:true,log:true}]});}
    data.routinesVersion=ROUTINES_VERSION;data.planStart=data.planStart||todayStr();save();render();updateStats();
    toast("🆕 Rutinas nuevas: piernas + abdomen · tu historial está intacto");
  }
}
// Sesión en curso: lo marcado en cada rutina se guarda en el teléfono (data.drafts) para no perderlo al ir atrás o cerrar la app
function stash(){
  if(typeof draft==="undefined"||!ROUTINE_TABS.includes(currentTab)||editMode)return;
  data.drafts=data.drafts||{};
  if(Object.values(draft).some(v=>v.done||(v.sets&&v.sets.length)))
    data.drafts[currentTab]={draft,date:sessionDate,editingId,activeEx,start:data.curStart&&data.curStart.tab===currentTab?data.curStart.t:null,ts:Date.now()};
  else delete data.drafts[currentTab];
}
function hasDraft(t){return !!(data.drafts&&data.drafts[t]);}
function save(){stash();try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast("⚠️ No se pudo guardar");}}

/* ---------- UTILIDADES ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(iso){const d=new Date(iso);const dias=["dom","lun","mar","mié","jue","vie","sáb"];
  return `${dias[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`;}
function fmtShort(ds){const d=new Date(ds.length===10?ds+'T12:00:00':ds);return d.getDate()+" "+MES[d.getMonth()];}
function weekStart(dt){const x=new Date(dt);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function isGym(t){return GYM_ORDER.includes(t)||t==="gymC";}
function sessName(t){const R=data.routines[t]||DEFAULT_ROUTINES[t];if(R)return R.emoji+" "+R.nombre.split(' · ')[0];return LEGACY[t]||t;}
function sorted(){return [...data.sessions].sort((a,b)=>new Date(a.date)-new Date(b.date));}
function thisWeek(){const ws=weekStart(new Date());return data.sessions.filter(s=>new Date(s.date)>=ws);}
function target(d){const m=String(d||"").match(/(\d+)\s*[×x]\s*(\d+)(?:\s*-\s*(\d+))?/);return m?{sets:+m[1],top:+(m[3]||m[2])}:null;}
function lastLog(n){const s=sorted();for(let i=s.length-1;i>=0;i--){const l=(s[i].logs||[]).find(x=>x.n===n);if(l)return {...l,date:s[i].date};}return null;}
function nums(s){return (String(s||"").match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));}
// Rotación A → B → C sin importar el día de la semana
function nextCasa(){const g=sorted().filter(s=>CASA_ORDER.includes(s.tipo));if(!g.length)return CASA_ORDER[0];return CASA_ORDER[(CASA_ORDER.indexOf(g[g.length-1].tipo)+1)%CASA_ORDER.length];}
// Metas de la semana: 3 gym; casa 1 si hubo clase de handstand, 2 si no
function metas(){const wk=thisWeek();return {gym:wk.filter(s=>isGym(s.tipo)).length,casa:wk.filter(s=>CASA.includes(s.tipo)).length,
  casaMeta:wk.some(s=>s.tipo==="handstand")?1:2};}
function isUpper(t){return CASA.includes(t)||t==="handstand"||ESC.includes(t);}
function nextGym(){const g=sorted().filter(s=>isGym(s.tipo));if(!g.length)return GYM_ORDER[0];const i=GYM_ORDER.indexOf(g[g.length-1].tipo);return GYM_ORDER[(i+1)%GYM_ORDER.length];}
// Búsqueda en Google Videos: funciona en cualquier navegador (el link de búsqueda de YouTube se abría vacío en el teléfono)
function videoLink(q){return "https://www.google.com/search?tbm=vid&q="+encodeURIComponent(q);}
function skillLv(n){const e=LIB[n];if(!e||!e.niveles)return 0;const i=(data.skillLv||{})[n]??(e.lvlDefault||0);return Math.min(i,e.niveles.length-1);}
// Dosis efectiva: en skills manda el nivel de progresión elegido
function effD(ex){const e=LIB[ex.n];return ex.skill&&e&&e.niveles?e.niveles[skillLv(ex.n)].d:(ex.d||"");}

function fieldsHtml(t,f,open,attr,n){

function addFormHtml(bi){

// Aplica un cambio de campo a un ejercicio de la rutina y regenera su dosis
function applyField(ex,fld,val){
  const t=editTipo(ex),p=parseDose(ex.d);
  const f={sets:p.sets,val:p.val,nota:t==="marcar"?(ex.d||""):p.nota,ss:p.ss};
  if(fld==="rest"){const v=parseInt(val,10);if(isNaN(v))delete ex.rest;else ex.rest=v;return;}
  if(fld==="lvl"){data.skillLv=data.skillLv||{};data.skillLv[ex.n]=+val;return;}
  if(fld==="sets"){const v=parseInt(val,10);if(v>0)f.sets=v;}
  else if(fld==="val")f.val=String(val).replace(/\s/g,'')||f.val;
  else if(fld==="nota")f.nota=val;
  else if(fld==="ss")f.ss=val;
  if(t!=="skill")ex.d=buildDose(t,f);
}
function setType(ex,t){
  const p=parseDose(ex.d),r=libRec(ex.n);
  if(t==="skill"){ex.skill=true;ex.log=true;delete ex.tipo;delete ex.d;return;}
  delete ex.skill;ex.tipo=t;ex.log=t!=="marcar";
  const sameUnit=(t==="seg")===(p.unit==="seg")&&(t==="min")===(p.unit==="min");
  const val=sameUnit&&p.val?p.val:(t==="seg"?"20":t==="min"?"10":(r.tipo===t&&r.val)||"10");

function parseDose(d){

  const m=parts[0].match(/^(\d+)\s*[×x]\s*(\d+(?:\s*-\s*\d+)?|máx)\s*(seg|min)?/);

function cicloInfo(ref){
  const st=[...new Set(((data.ciclo||{}).starts)||[])].sort();if(!st.length)return null;
  const D=x=>new Date(x+"T12:00:00"),days=(a,b)=>Math.round((D(b)-D(a))/86400000);
  const lens=[];for(let i=1;i<st.length;i++){const l=days(st[i-1],st[i]);if(l>=18&&l<=45)lens.push(l);}
  const use=lens.slice(-8),avg=use.length?use.reduce((a,b)=>a+b,0)/use.length:28;
  const L=Math.round(avg),mn=use.length?Math.min(...use):L-2,mx=use.length?Math.max(...use):L+2;
  const last=st[st.length-1],today=ref||todayStr(),d=days(last,today)+1,ov=L-14;
  let f=d<=5?"mens":d<=ov-2?"fol":d<=ov+1?"ov":d<=L-6?"lut1":"lut2";
  const add=(iso,n)=>{const x=D(iso);x.setDate(x.getDate()+n);return dstr(x);};
  const pred=[1,2,3].map(k=>({mid:add(last,L*k),lo:add(last,mn*k),hi:add(last,mx*k)}));
  const cuts=[5,Math.max(6,ov-2),ov+1,Math.max(ov+2,L-6),L];
  return {st,lens,use,avg,L,mn,mx,last,d,ov,f,pred,cuts,late:d>mx?d-mx:0};
}

// Une las sesiones del mismo tipo y del mismo día (ej. se cerró por error y se empezó otra)
function sameDay(a,b){return a.tipo===b.tipo&&dstr(new Date(a.date))===dstr(new Date(b.date));}
function mergeSessions(id){
  const base=data.sessions.find(x=>x.id==id);if(!base)return;
  const grp=data.sessions.filter(x=>sameDay(x,base)).sort((a,b)=>(a.start||a.id)-(b.start||b.id));
  if(grp.length<2)return;
  if(!confirm(`¿Unir las ${grp.length} sesiones de ${sessName(base.tipo)} del ${fmtDate(base.date)} en una sola?`))return;
  const keep=grp[0],logs=[],done=new Set();
  grp.forEach(x=>{(x.done||(x.logs||[]).map(l=>l.n)).forEach(n=>done.add(n));
    (x.logs||[]).forEach(l=>{const e=logs.find(y=>y.n===l.n);
      if(!e){logs.push(JSON.parse(JSON.stringify(l)));return;}
      if(e.sets&&l.sets){e.sets=e.sets.concat(l.sets);e.reps=e.sets.map(z=>z.reps).join(" ");const k=Math.max(...e.sets.map(z=>z.kg||0));e.kg=k?String(k):"";}
      const sfx=" (kg×reps)",clean=v=>String(v||"").replace(sfx,""),lvl=(clean(e.v).match(/^Nivel \d+ · /)||[""])[0];
      e.v=clean(e.v)+" · "+clean(l.v).replace(/^Nivel \d+ · /,"")+(String(e.v).includes(sfx)||String(l.v).includes(sfx)?sfx:"");});});
  keep.logs=logs;keep.done=[...done];delete keep.kcal;keep.count=Math.max(done.size,...grp.map(x=>x.count||0));
  const st=grp.map(x=>x.start).filter(Boolean),en=grp.map(x=>x.end).filter(Boolean);
  if(st.length)keep.start=Math.min(...st);if(en.length)keep.end=Math.max(...en);
  data.sessions=data.sessions.filter(x=>x===keep||!grp.includes(x));
  save();updateStats();renderHist();toast("🔗 Sesiones unidas");
}

/* Fitia: promedios semanales (lunes a domingo) guardados en data.fitia[lunes] = {kcal,p,c,g} */
const META={kcal:[1550,1750],p:[110,120],c:[130,170],g:[50,60]};
function mondayOf(d){return dstr(weekStart(d));}
function weekLabel(mon){const a=new Date(mon+'T12:00:00'),b=new Date(a);b.setDate(a.getDate()+6);
  return `lun ${a.getDate()}${a.getMonth()!==b.getMonth()?' '+MES[a.getMonth()]:''} – dom ${b.getDate()} ${MES[b.getMonth()]}`;}
let fitiaWeek=null, fitiaHist=false;
// Meta y gasto promedio de una semana (lun-dom), según los entrenamientos registrados. Solo cuenta días hasta hoy.
function semanaKcal(mon){
  let m=0,g=0,n=0;
  for(let k=0;k<7;k++){const d=new Date(mon+'T12:00:00');d.setDate(d.getDate()+k);const ds=dstr(d);if(ds>todayStr())break;
    const x=diaKcal(ds);m+=x.meta;g+=x.gasto;n++;}
  return n?{meta:r10(m/n),gasto:r10(g/n)}:null;
}
// 🟢 en la meta · 🟠 sobre la meta pero bajo el gasto · 🔴 sobre el gasto · "bajo": muy bajo la meta
function estadoKcal(kcal,s){if(!s||!kcal)return null;if(kcal<s.meta-250)return "bajo";if(kcal<=s.meta+50)return "ok";if(kcal<=s.gasto)return "medio";return "alto";}
function evalWeek(v,mon){
  const out=[], n=x=>Math.round(x).toLocaleString('es-CL');
  const s=semanaKcal(mon),e=estadoKcal(v.kcal,s);
  if(v.kcal&&v.kcal<1400)out.push(["wa",`🔥 Muy bajo (${n(v.kcal)} kcal): cuidado con tu Vata (ansiedad, mal dormir). Come lo que te pide el entrenamiento.`]);
  else if(e==="bajo")out.push(["wa",`🔥 Comiste ~${n(r10(s.meta-v.kcal))} kcal menos que tu meta: no bajes más, tu entrenamiento necesita energía.`]);
  else if(e==="ok")out.push(["ok","🟢 Calorías en tu meta ✅"]);
  else if(e==="medio")out.push(["wa",`🟠 Te pasaste ~${n(r10(v.kcal-s.meta))} kcal de la meta, pero igual comiste ~${n(r10(s.gasto-v.kcal))} menos de lo que gastaste: estás bajando, más lento.`]);
  else if(e==="alto")out.push(["wa",`🔴 Comiste ~${n(r10(v.kcal-s.gasto))} kcal más de lo que gastaste: esa semana no bajaste.`]);
  if(v.p){
    if(v.p>=META.p[0])out.push(["ok","🥚 Proteína cumplida ✅"]);
    else out.push(["wa",`🥚 Te faltan ~${n(META.p[0]-v.p)} g de proteína al día: suma 2 huevos (12 g) o ½ lata de atún (13 g).`]);
  }
  if(v.c){
    if(v.c>META.c[1])out.push(["wa",`🍚 Carbos altos (+${n(v.c-META.c[1])} g): revisa pan, arroz y dulces.`]);
    else if(v.c<META.c[0])out.push(["wa","🍚 Carbos bajos: para entrenar necesitas energía, suma fruta o avena."]);
    else out.push(["ok","🍚 Carbos en rango ✅"]);
  }
  if(v.g){
    if(v.g>META.g[1])out.push(["wa",`🥑 Grasa alta (+${n(v.g-META.g[1])} g): revisa semillas, frutos secos y aceite.`]);

    else out.push(["ok","🥑 Grasa en rango ✅"]);
  }

}
// Gráfico: barras = kcal promedio de Fitia (color según la meta de esa semana); raya negra = meta; raya punteada = gasto real
const KCOL={ok:"#C0DD97",medio:"#FAC775",alto:"#F09595",bajo:"#B5D4F4"};
function fitiaChart(weeks){
  if(!weeks.length)return "";
  const W=320,H=150,pl=8,pr=8,pt=12,pb=22,n=weeks.length,slot=(W-pl-pr)/n,bw=Math.min(34,slot*.55);
  const S=weeks.map(w=>semanaKcal(w.mon));
  const kmax=Math.max(1800,...weeks.map(w=>w.v.kcal||0),...S.map(s=>s?s.gasto:0))*1.08;
  const Y=v=>pt+(1-v/kmax)*(H-pt-pb);
  let g=`<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#e6dccf"/>`;
  weeks.forEach((w,i)=>{const x=pl+slot*i+slot/2,s=S[i],e=estadoKcal(w.v.kcal,s);
    if(w.v.kcal)g+=`<rect x="${x-bw/2}" y="${Y(w.v.kcal)}" width="${bw}" height="${H-pb-Y(w.v.kcal)}" rx="3" fill="${KCOL[e]||'#D3D1C7'}"/>`;
    if(s){g+=`<line x1="${x-bw/2-4}" x2="${x+bw/2+4}" y1="${Y(s.meta)}" y2="${Y(s.meta)}" stroke="#2c2723" stroke-width="2.5"/>`;
      g+=`<line x1="${x-bw/2-4}" x2="${x+bw/2+4}" y1="${Y(s.gasto)}" y2="${Y(s.gasto)}" stroke="#2f7d78" stroke-width="2" stroke-dasharray="3 3"/>`;}
    const d=new Date(w.mon+'T12:00:00');g+=`<text x="${x}" y="${H-7}" font-size="9" fill="#8a7f74" text-anchor="middle">${d.getDate()} ${MES[d.getMonth()]}</text>`;});
  const cin=data.medidas.filter(m=>m.cintura).sort((a,b)=>a.date.localeCompare(b.date)).map(m=>({x:m.date,y:m.cintura}));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>
    <div class="flegend"><span><i style="background:#FAC775"></i>comiste</span><span><i class="lm"></i>meta de esa semana</span><span><i class="lg"></i>gasto real</span></div>
    <p class="small">🟢 en la meta · 🟠 sobre la meta pero bajo tu gasto (bajas más lento) · 🔴 sobre tu gasto (no bajas) · 🔵 muy bajo la meta</p>
    <p class="small" style="margin-top:10px"><b>📐 Cintura</b> (de 📈 Progreso)</p>${cin.length>1?lineChart(cin,"cm","#2f7d78"):'<p class="small">Registra tu cintura cada semana para ver la línea.</p>'}`;
}

/* ---------- CALORÍAS ----------
   Sesión: MET × peso × horas. Caminata: 3,5 MET × (peso + mochila) × h + ~0,6 kcal por metro de desnivel (con 65 kg), +10% sobre 3.000 m.
   Día: mantención = Mifflin-St Jeor (mujer, 28 años, 160 cm) × 1,3 (+100 kcal en fase lútea).
   El 1,3 = trabajo sentada + bici al trabajo (2,1 km, ~7 min por tramo) + vuelta después de almuerzo. Entrenamientos y terrenos se suman aparte.
   Meta para comer = mantención + 0,8 × ejercicio neto − 350 (déficit), nunca menos de 1.400. */
const MET={gymA:5,gymB:5,gymC:5,casa:3.8,casa1:4,casa2:4,casa3:4,casaMini:3,escalada:5.8,escaladaR:5.8,yogaAM:2.8,yoga:2,handstand:4};
const DUR_DEF={gymA:60,gymB:60,gymC:60,casa:30,casa1:50,casa2:50,casa3:50,casaMini:10,escalada:90,escaladaR:90,yogaAM:12,yoga:20,handstand:60};
const NAT_MET={suave:5.8,moderada:7,fuerte:9.8};
const NAT_TXT={suave:"🙂 Suave",moderada:"😤 Moderada",fuerte:"🔥 Fuerte"};
function pesoActual(){const M=data.medidas.filter(m=>m.peso).sort((a,b)=>a.date.localeCompare(b.date));return M.length?M[M.length-1].peso:65;}
function sessMin(s){
  if(s.dur)return s.dur;
  if(s.start&&s.end){const m=Math.round((s.end-s.start)/60000);if(m>=5&&m<=300)return m;}
  return DUR_DEF[s.tipo]||45;
}
function kcalCaminata(min,kg,mochila,desn,alt){
  const carga=kg+(mochila||0);
  let k=3.5*carga*min/60+0.6*(desn||0)*carga/65;
  if((alt||0)>3000)k*=1.1;
  return k;
}
function kcalOf(s,kg){
  if(s.kcal!=null)return s.kcal;
  kg=kg||pesoActual();const h=sessMin(s)/60;
  if(s.tipo==="caminata")return Math.round(kcalCaminata(sessMin(s),kg,s.mochila,s.desn,s.alt));
  if(s.tipo==="natacion")return Math.round((NAT_MET[s.int]||7)*kg*h);
  return Math.round((MET[s.tipo]||4)*kg*h);
}
// Gasto "extra" del ejercicio: se resta 1 MET (lo que igual gastarías en reposo)
function netOf(s,kg){kg=kg||pesoActual();return Math.max(0,kcalOf(s,kg)-kg*sessMin(s)/60);}
function baseDia(ds){
  const kg=pesoActual(),bmr=10*kg+6.25*160-5*28-161;
  const c=cicloInfo(ds),lut=c&&!c.late&&(c.f==="lut1"||c.f==="lut2");
  return {base:Math.round(bmr*1.3)+(lut?100:0),lut};
}
function r10(x){return Math.round(x/10)*10;}
function nfmt(x){return Math.round(x).toLocaleString('es-CL');}
function diaKcal(ds){
  ds=ds||todayStr();
  const ss=data.sessions.filter(s=>dstr(new Date(s.date))===ds);
  const ej=ss.reduce((a,s)=>a+kcalOf(s),0),net=ss.reduce((a,s)=>a+netOf(s),0);
  const {base,lut}=baseDia(ds);
  return {ss,ej,net,base,lut,gasto:r10(base+net),meta:Math.max(1400,r10(base+0.8*net-350))};
}

function saveLibForm(){
  const f=libForm.f,n=f.n.trim();
  if(!n){toast("Escribe el nombre del ejercicio ✏️");return;}
  if(n!==libForm.orig&&LIB[n]){toast("Ya existe un ejercicio con ese nombre");return;}
  const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
  const old=libForm.orig?LIB[libForm.orig]:{};
  const e={cat:f.cat.trim()||"Otros",musc:f.musc.trim()||"—",pasos:lines(f.pasos),fij:lines(f.fij),err:lines(f.err),
    q:old&&old.q&&n===libForm.orig?old.q:n+" técnica"};
  if(old&&old.v)e.v=old.v;
  if(f.alt.trim())e.alt=f.alt.trim();if(f.rod.trim())e.rod=f.rod.trim();if(f.codo.trim())e.codo=f.codo.trim();
  const rest=parseInt(f.rest,10);
  if(f.tipo==="skill"){
    e.skill=true;
    e.niveles=f.niveles.filter(l=>l.n.trim()).map(l=>{const d=`${parseInt(l.sets,10)||3} × ${l.val||'10'}${l.t==="seg"?' seg':''}`;return l.t==="peso"?{n:l.n.trim(),d,t:"peso"}:{n:l.n.trim(),d};});
    if(!e.niveles.length){toast("Agrega al menos un nivel");return;}
    e.rec={tipo:"skill",rest:isNaN(rest)?90:rest};
  }else e.rec={tipo:f.tipo,sets:parseInt(f.sets,10)||3,val:String(f.val||"10").replace(/\s/g,''),nota:f.tipo==="marcar"?f.nota:"",rest:isNaN(rest)?90:rest};
  data.libEdits=data.libEdits||{};
  if(libForm.orig&&libForm.orig!==n){
    // Cambio de nombre: se actualiza en las rutinas y en el nivel guardado
    if(LIB_BASE[libForm.orig])data.libEdits[libForm.orig]=null;else delete data.libEdits[libForm.orig];
    Object.values(data.routines).forEach(R=>R.blocks.forEach(bl=>bl.ex.forEach(ex=>{if(ex.n===libForm.orig)ex.n=n;})));
    if(data.skillLv&&data.skillLv[libForm.orig]!=null){data.skillLv[n]=data.skillLv[libForm.orig];delete data.skillLv[libForm.orig];}
  }
  data.libEdits[n]=e;buildLib();save();libForm=null;toast("Guardado en la biblioteca 📚");renderLib();
}
function deleteLib(n){
  const inR=Object.entries(data.routines).filter(([t,R])=>R.blocks.some(bl=>bl.ex.some(ex=>ex.n===n))).map(([t,R])=>R.nombre.split(' · ')[0]);
  if(!confirm(inR.length?`"${n}" está en ${inR.join(" y ")}.\n\n¿Borrarlo de la biblioteca y quitarlo también de esas rutinas? Tu historial se conserva.`:`¿Borrar "${n}" de la biblioteca?`))return;
  Object.values(data.routines).forEach(R=>R.blocks.forEach(bl=>{bl.ex=bl.ex.filter(ex=>ex.n!==n);}));
  data.libEdits=data.libEdits||{};
  if(LIB_BASE[n])data.libEdits[n]=null;else delete data.libEdits[n];
  buildLib();save();toast("Borrado 🗑️");renderLib();
}

function lineChart(pts,unit,color){
  if(pts.length<2)return `<p class="small">Necesitas al menos 2 registros para ver el gráfico.</p>`;
  const W=320,H=150,pl=34,pr=10,pt=12,pb=22;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<1){mn-=0.5;mx+=0.5;}
  const pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
  const t0=new Date(pts[0].x).getTime(),t1=new Date(pts[pts.length-1].x).getTime()||t0+1;
  const X=t=>pl+(t1===t0?0.5:(new Date(t).getTime()-t0)/(t1-t0))*(W-pl-pr);
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const line=pts.map(p=>`${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const fmt=v=>(Math.round(v*10)/10).toString().replace('.',',');
  let g="";[mx-pad,(mx+mn)/2,mn+pad].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6dccf" stroke-dasharray="3 3"/><text x="${pl-4}" y="${Y(v)+3}" font-size="9" fill="#8a7f74" text-anchor="end">${fmt(v)}</text>`;});
  const dots=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${color}"/>`).join("");
  const first=pts[0],last=pts[pts.length-1],diff=last.y-first.y;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${dots}
    <text x="${pl}" y="${H-6}" font-size="9" fill="#8a7f74">${fmtShort(first.x)}</text><text x="${W-pr}" y="${H-6}" font-size="9" fill="#8a7f74" text-anchor="end">${fmtShort(last.x)}</text></svg>
    <p class="small">Desde el inicio: <b style="color:${color}">${diff>0?'+':''}${fmt(diff)} ${unit}</b></p>`;
}

/* % grasa estimado: fórmula de la Marina de EE.UU. para mujeres (cm). Error típico ±3-4 puntos: sirve para ver tendencia. */
const ALTURA=160;
function navyBF(m){
  if(!m.cintura||!m.cadera||!m.cuello)return null;
  const x=m.cintura+m.cadera-m.cuello;if(x<=0)return null;
  const bf=495/(1.29579-0.35004*Math.log10(x)+0.22100*Math.log10(ALTURA))-450;
  return Math.round(bf*10)/10;
}

/* Fotos en IndexedDB (se quedan solo en este teléfono) */
const FDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open("entreno_fotos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("fotos",{keyPath:"id"});
    r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("fotos",mode);const st=t.objectStore("fotos");const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});},
  all(){return this.tx("readonly",s=>s.getAll());},
  put(o){return this.tx("readwrite",s=>s.put(o));},
  del(id){return this.tx("readwrite",s=>s.delete(id));},
};
function compress(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const max=900;let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.78));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;});}

let fuerzaEx=null;
function renderFuerza(body){
  const series={};
  sorted().forEach(s=>(s.logs||[]).forEach(l=>{const kg=parseFloat(String(l.kg||"").replace(',','.'));if(!isNaN(kg)&&kg>0){(series[l.n]=series[l.n]||[]).push({x:dstr(new Date(s.date)),y:kg});}}));
  const names=Object.keys(series);
  if(!names.length){body.innerHTML=`<div class="empty">Cuando anotes los kg en tus sesiones de gym, aquí verás cómo sube tu fuerza en cada ejercicio 💪</div>`;return;}
  if(!fuerzaEx||!series[fuerzaEx])fuerzaEx=names[0];
  body.innerHTML=`<div class="card"><h3>🏋️ Progresión de carga</h3>
    <select class="full" id="fEx">${names.map(n=>`<option ${n===fuerzaEx?'selected':''}>${esc(n)}</option>`).join("")}</select>
    ${lineChart(series[fuerzaEx],"kg","#3b6ea5")}</div>`;
  document.getElementById("fEx").onchange=e=>{fuerzaEx=e.target.value;renderFuerza(body);};
}

/* ---------- HISTORIAL ---------- */
function progressText(){
  const L=[`PROGRESO DE DIANA · ${fmtDate(new Date().toISOString())}`,""];
  const ss=[...data.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,40);
  L.push(`SESIONES (${data.sessions.length} en total; últimas ${ss.length}):`);
  ss.forEach(x=>{L.push(`- ${fmtDate(x.date)} · ${sessName(x.tipo)}${isGym(x.tipo)||ROUTINE_TABS.includes(x.tipo)?` · ${x.count} ejercicios`:''}${durTxt(x)?' · '+durTxt(x).replace('⏱️ ',''):''} · ~${nfmt(kcalOf(x))} kcal`);
    (x.logs||[]).forEach(l=>L.push(`    ${l.n}: ${l.v}`));});
  const M=[...data.medidas].sort((a,b)=>a.date.localeCompare(b.date));
  if(M.length){L.push("","MEDIDAS:");M.forEach(m=>L.push(`- ${m.date} · peso ${m.peso??'—'} kg · cintura ${m.cintura??'—'} · cadera ${m.cadera??'—'} · cuello ${m.cuello??'—'}${navyBF(m)!=null?` · grasa ≈ ${navyBF(m)}%`:''}`));}
  const F=Object.keys(data.fitia||{}).sort();
  if(F.length){L.push("","FITIA (promedios semanales):");F.forEach(k=>{const v=data.fitia[k];L.push(`- semana ${weekLabel(k)} · ${v.kcal??'—'} kcal · ${v.p??'—'} g prot · ${v.c??'—'} g carbos · ${v.g??'—'} g grasa`);});}
  const ci=cicloInfo();
  if(ci){L.push("","CICLO MENSTRUAL:",`- hoy día ${ci.d} de ~${ci.L} · fase ${FASES[ci.f].n} · promedio ${Math.round(ci.avg*10)/10} días (${ci.mn}-${ci.mx})`,`- días 1 registrados: ${ci.st.slice(-6).join(", ")}`,`- próxima estimada: ${ci.pred[0].mid}`);}
  const lv=Object.keys(LIB).filter(n=>LIB[n].niveles&&data.skillLv&&data.skillLv[n]!=null);
  if(lv.length){L.push("","NIVELES DE SKILLS:");lv.forEach(n=>L.push(`- ${n}: nivel ${skillLv(n)+1} (${LIB[n].niveles[skillLv(n)].n})`));}
  return L.join("\n");
}
// Respaldo: archivo JSON con todo lo que está en localStorage (las fotos viven aparte, en IndexedDB)
function downloadBackup(){
  data.lastBackup=new Date().toISOString();save();
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`respaldo-entrenamiento-${todayStr()}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast("💾 Respaldo descargado");renderHist();
}
function restoreBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result);}catch(e){toast("⚠️ Ese archivo no es un respaldo válido");return;}
    if(!d||!Array.isArray(d.sessions)||!d.routines){toast("⚠️ Ese archivo no es un respaldo de esta app");return;}
    if(!confirm(`Restaurar este respaldo (${d.sessions.length} sesiones, ${(d.medidas||[]).length} medidas)?\n\nReemplaza los datos que tienes ahora en este teléfono.`))return;
    data=d;if(!data.medidas)data.medidas=[];save();buildLib();checkRoutinesUpdate();updateStats();toast("✅ Respaldo restaurado");goTab("hoy");};
  r.readAsText(file);
}
function exportProgress(){
  const txt=progressText();
  const fallback=()=>{main.insertAdjacentHTML("afterbegin",`<textarea id="expTxt" style="width:100%;height:220px;margin-bottom:10px;font-size:12px">${esc(txt)}</textarea>`);
    const t=document.getElementById("expTxt");t.focus();t.select();toast("Selecciona todo y copia 📋");};
  try{navigator.clipboard.writeText(txt).then(()=>toast("📋 Copiado: pégalo en tu chat con Claude"),fallback);}catch(e){fallback();}
}
function renderHist(){
  const s=[...data.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  let html=`<button class="tile th-am" id="exportBtn" style="width:100%;margin-bottom:6px">📤 Copiar mi progreso</button>
  <p class="small" style="margin:0 0 10px">Copia un resumen de tus sesiones, series, medidas y semanas de Fitia para pegarlo en tu chat con Claude.</p>
  <div class="card"><h3>💾 Respaldo</h3>
    <p class="small">Guarda una copia de todos tus datos (sesiones, medidas, Fitia, niveles, rutinas y biblioteca). Las fotos no se incluyen. Hazlo cada cierto tiempo y guarda el archivo en Archivos o en tu correo.</p>
    <div class="tiles t2" style="margin:8px 0 0"><div class="tile th-am" id="bkDown">⬇️ Descargar respaldo</div>
    <label class="tile th-am" style="margin:0">⬆️ Restaurar respaldo<input type="file" accept="application/json,.json" id="bkUp" style="display:none"></label></div>
    ${data.lastBackup?`<p class="small" style="margin-top:8px">Último respaldo: ${fmtDate(data.lastBackup)}</p>`:''}</div>
  <div class="intro" style="margin-bottom:14px">📊 Tu historial · ${data.sessions.length} sesiones registradas</div>`;
  if(!s.length)html+=`<div class="empty">Todavía no registras sesiones.<br>¡Haz tu primer gym y guárdalo! 💪</div>`;
  s.forEach(sess=>{
    let logs="";(sess.logs||[]).forEach(l=>{logs+=`<div><b>${esc(l.n)}:</b> ${esc(l.v)}</div>`;});
    html+=`<div class="hitem">
      <div class="hitem-h"><span class="hitem-t">${esc(sessName(sess.tipo))}</span>
        <span class="hbtns">${ROUTINE_TABS.includes(sess.tipo)?`<button class="hlink" data-reopen="${sess.id}">✏️ Reabrir</button>`:''}${data.sessions.some(x=>x!==sess&&sameDay(x,sess))&&ROUTINE_TABS.includes(sess.tipo)?`<button class="hlink" data-merge="${sess.id}">🔗 Unir</button>`:''}<button class="del" data-del="${sess.id}">Borrar</button></span></div>
      <div class="hitem-d">${fmtDate(sess.date)}${isGym(sess.tipo)||ROUTINE_TABS.includes(sess.tipo)?` · ${sess.count} ejercicios`:''}${durTxt(sess)?` · ${durTxt(sess)}`:''} · 🔥 ~${nfmt(kcalOf(sess))} kcal
        <button class="hlink" data-hora="${sess.id}">🕐 ${sess.start?'cambiar hora':'agregar hora'}</button></div>
      ${histEd==sess.id?`<div class="tedit"><label>Inicio<input type="time" id="hIni" value="${sess.start?hhmm(sess.start):''}"></label><label>Fin<input type="time" id="hFin" value="${sess.end?hhmm(sess.end):''}"></label><button class="hsave" data-hsave="${sess.id}">Guardar</button></div>`:''}
      ${logs?`<div class="hitem-logs">${logs}</div>`:''}
    </div>`;
  });
  main.innerHTML=html;
  document.getElementById("exportBtn").onclick=exportProgress;
  document.getElementById("bkDown").onclick=downloadBackup;
  document.getElementById("bkUp").onchange=e=>restoreBackup(e.target.files[0]);
  main.querySelectorAll("[data-reopen]").forEach(el=>{el.onclick=()=>reopenSession(el.dataset.reopen);});
  main.querySelectorAll("[data-hora]").forEach(el=>{el.onclick=()=>{histEd=histEd==el.dataset.hora?null:el.dataset.hora;renderHist();};});
  main.querySelectorAll("[data-hsave]").forEach(el=>{el.onclick=()=>{
    const sess=data.sessions.find(x=>x.id==el.dataset.hsave);if(!sess)return;
    const a=document.getElementById("hIni").value,b=document.getElementById("hFin").value;
    if(!a||!b){toast("Anota la hora de inicio y de fin 🕐");return;}
    const day=dstr(new Date(sess.date)),st=new Date(day+"T"+a).getTime(),en=new Date(day+"T"+b).getTime();
    if(en<=st){toast("La hora de fin debe ser después del inicio");return;}
    sess.start=st;sess.end=en;if(sess.dur!=null)sess.dur=Math.round((en-st)/60000);
    sess.kcal=null;sess.kcal=kcalOf(sess);histEd=null;save();renderHist();toast("Hora actualizada 🕐");};});
  main.querySelectorAll("[data-merge]").forEach(el=>{el.onclick=()=>mergeSessions(el.dataset.merge);});
  main.querySelectorAll("[data-del]").forEach(el=>{
    el.onclick=()=>{if(confirm("¿Borrar esta sesión?")){data.sessions=data.sessions.filter(x=>x.id!=el.dataset.del);save();updateStats();renderHist();}};
  });
}

function updateStats(){
  const wk=thisWeek();
  const ps=BLOCK.start,GOAL=BLOCK.goal;
  const total=data.sessions.filter(s=>isGym(s.tipo)&&dstr(new Date(s.date))>=ps).length;
  const pct=Math.min(100,Math.round(total/GOAL*100));
  const wkN=Math.floor((new Date(todayStr())-new Date(ps))/(7*86400000))+1;
  document.getElementById("progfill").style.width=pct+"%";
  document.getElementById("progtxt").textContent=wkN>BLOCK.weeks?`✅ Terminaste las ${BLOCK.weeks} semanas · ${total} / ${GOAL} gym · toca actualizar la rutina`:`Semana ${wkN} de ${BLOCK.weeks}${wkN===7?' · semana liviana: mitad de series':''} · ${total} / ${GOAL} gym (${pct}%)`;
}

let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}

document.querySelectorAll("#nav button").forEach(b=>{b.onclick=()=>goTab(b.dataset.tab);});

const backdrop=document.getElementById("backdrop");
function openSheet(id){document.getElementById(id).classList.add("open");backdrop.classList.add("open");}
function closeSheets(){document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("open"));backdrop.classList.remove("open");}
