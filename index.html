/* ---------- CRONÓMETRO ---------- */
(function(){
  const disp=document.getElementById("tmDisplay");
  const phaseEl=document.getElementById("tmPhase");
  const presets=document.getElementById("tmPresets");
  const startBtn=document.getElementById("tmStart");
  const resetBtn=document.getElementById("tmReset");
  const PREP_MS=5000;
  let mode="cd", running=false, iv=null;
  let swElapsed=0, swStart=0;
  let cdSet=90000, cdEnd=0, cdRemain=90000;
  let phase="work";      // "prep" (5 s de preparación) o "work"
  let lastSec=null;      // para los tics de 3-2-1
  let restMs=90000, label="Descanso", onDone=null, autoClose=false, closeT=null;
  const title=document.getElementById("tmTitle");
  function setLabel(l){label=l;title.textContent="⏱️ "+l;}
  let actx=null, wake=null;

  // iPhone: categoría "ambient" para que los pitidos se MEZCLEN con la música (Spotify, etc.) en vez de pausarla.
  // Ya no se usa el audio silencioso en bucle: el iPhone lo trataba como reproducción de música y cortaba la de Diana.
  let unlocked=false;
  function ensureAudio(){
    try{if(navigator.audioSession)navigator.audioSession.type="ambient";}catch(e){}
    try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")actx.resume();}catch(e){}
    if(!unlocked){unlocked=true;
      try{const src=actx.createBufferSource();src.buffer=actx.createBuffer(1,1,22050);src.connect(actx.destination);src.start(0);}catch(e){}
    }
  }
  // Desbloquea el audio con el primer toque en cualquier parte de la app
  document.addEventListener("touchend",ensureAudio,{once:true});document.addEventListener("click",ensureAudio,{once:true});
  function tone(freq,dur,delay,vol){try{ensureAudio();vol=vol||0.8;const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
    o.frequency.value=freq;const t=actx.currentTime+(delay||0);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}}
  // Sonidos: tic (3-2-1), inicio (dos tonos que suben), fin (tres tonos largos)
  function sndTick(){tone(660,0.12,0,0.6);}
  function sndStart(){tone(880,0.15,0);tone(1320,0.3,0.17);if(navigator.vibrate)navigator.vibrate(150);}
  function sndEnd(){for(let i=0;i<3;i++)tone(i<2?988:660,0.28,i*0.32);if(navigator.vibrate)navigator.vibrate([250,100,250,100,400]);}
  function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>{wake=w;}).catch(()=>{});
    if(!on&&wake){wake.release();wake=null;}}catch(e){}}

  function fmt(ms,ceil){let s=ceil?Math.ceil(ms/1000):Math.floor(ms/1000);if(s<0)s=0;const m=Math.floor(s/60);s=s%60;return String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');}
  const fab=document.getElementById("timerFab");
  function draw(){
    const showFab=running&&mode==="cd";
    fab.textContent=showFab?(phase==="prep"?"⏳"+Math.ceil(cdRemain/1000):fmt(cdRemain,true)):"⏱️";fab.style.fontSize=showFab?"14px":"24px";fab.style.fontWeight="800";
    if(mode==="sw"){disp.textContent=fmt(swElapsed,false);disp.classList.remove("warn","prep");phaseEl.textContent="";return;}
    disp.textContent=phase==="prep"?String(Math.max(1,Math.ceil(cdRemain/1000))):fmt(cdRemain,true);
    disp.classList.toggle("prep",phase==="prep");
    disp.classList.toggle("warn",phase==="work"&&cdRemain<=5000&&cdRemain>0);
    phaseEl.textContent=phase==="prep"?"Prepárate…":(running&&label.startsWith("Descanso")?"Descanso":(running&&label!=="Temporizador"?"¡Vamos!":""));
  }
  function tick(){
    if(mode==="sw"){swElapsed=Date.now()-swStart;draw();return;}
    cdRemain=cdEnd-Date.now();
    const sec=Math.ceil(cdRemain/1000);
    if(sec!==lastSec&&sec>0&&sec<=3){sndTick();}
    lastSec=sec;
    if(cdRemain>0){draw();return;}
    if(phase==="prep"){                      // termina la preparación: parte el ejercicio
      phase="work";sndStart();cdRemain=cdSet;cdEnd=Date.now()+cdSet;lastSec=null;draw();return;
    }
    cdRemain=0;stop();draw();sndEnd();
    const isRest=label.startsWith("Descanso"), cb=onDone; onDone=null;
    toast(isRest?"⏰ ¡A la siguiente serie!":"✅ "+label+": ¡terminado!");
    autoClose=false;
    if(!cb){clearTimeout(closeT);closeT=setTimeout(closeSheets,900);}
    if(cb){cb();                             // la serie con tiempo se registra sola y parte el descanso
      if(!running){cdRemain=cdSet;draw();clearTimeout(closeT);closeT=setTimeout(closeSheets,1200);}   // era la última serie: no hay descanso
      return;}
    cdRemain=cdSet;setTimeout(draw,900);
  }
  function start(){
    running=true;startBtn.textContent="Pausar";ensureAudio();keepAwake(true);
    if(mode==="sw"){swStart=Date.now()-swElapsed;}
    else{if(cdRemain<=0){cdRemain=cdSet;phase="work";}cdEnd=Date.now()+cdRemain;lastSec=null;}
    iv=setInterval(tick,100);
  }
  function stop(){running=false;startBtn.textContent="Iniciar";if(iv){clearInterval(iv);iv=null;}keepAwake(false);}
  function reset(){stop();phase="work";if(mode==="sw"){swElapsed=0;}else{cdRemain=cdSet;}draw();}

  fab.onclick=()=>openSheet("timerSheet");
  function countdown(ms,l,prep){stop();mode="cd";
    document.querySelectorAll("#timerSheet [data-tm]").forEach(x=>x.classList.toggle("active",x.dataset.tm==="cd"));
    presets.style.display="flex";setLabel(l);cdSet=ms;
    phase=prep?"prep":"work";cdRemain=prep?PREP_MS:ms;start();draw();}
  window.TIMER={
    // Descanso entre series: abre el cronómetro con el descanso recomendado y se cierra solo al terminar
    // done: si viene, al terminar el descanso se llama (parte la serie siguiente) y el cronómetro no se cierra
    rest(ms,l,done){clearTimeout(closeT);countdown(ms||restMs,l||"Descanso",false);onDone=done||null;autoClose=!done;openSheet("timerSheet");},
    // ▶ de un ejercicio: abre el cronómetro, 5 s de preparación y luego el tiempo; done() se llama al terminar
    countdown(ms,l,done){clearTimeout(closeT);countdown(ms,l,true);onDone=done||null;autoClose=false;openSheet("timerSheet");},
    get state(){return {running,phase,label,mode};}};
  startBtn.onclick=()=>{running?stop():start();};
  resetBtn.onclick=reset;

  document.querySelectorAll("#timerSheet [data-tm]").forEach(b=>{
    b.onclick=()=>{stop();mode=b.dataset.tm;phase="work";
      document.querySelectorAll("#timerSheet [data-tm]").forEach(x=>x.classList.toggle("active",x===b));
      presets.style.display=mode==="cd"?"flex":"none";
      if(mode==="cd"){cdRemain=cdSet;}else{swElapsed=0;}
      draw();};
  });
  document.querySelectorAll("#tmPresets [data-sec]").forEach(b=>{
    b.onclick=()=>{cdSet=(+b.dataset.sec)*1000;cdRemain=cdSet;phase="work";stop();
      if(+b.dataset.sec<=120){restMs=cdSet;setLabel("Descanso");}else setLabel("Temporizador");
      document.querySelectorAll("#tmPresets [data-sec]").forEach(x=>x.classList.toggle("sel",x===b));
      draw();};
  });
  document.getElementById("tmCustom").onchange=e=>{const v=parseFloat(e.target.value.replace(',','.'));if(isNaN(v)||v<=0)return;
    stop();cdSet=Math.round(v*60)*1000;cdRemain=cdSet;phase="work";setLabel("Temporizador");
    document.querySelectorAll("#tmPresets [data-sec]").forEach(x=>x.classList.remove("sel"));draw();};
  draw();
})();

document.getElementById("appver").textContent=APP_VERSION;
checkRoutinesUpdate();
updateStats();
render();
</script>
