<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#c1663f">
<title>Mi Entrenamiento · Diana</title>
<style>
  :root{
    --terra:#c1663f; --terra-dark:#9e4f2f; --sand:#f4ece2; --cream:#fbf7f1;
    --teal:#2f7d78; --teal-light:#e0efed; --ink:#2c2723; --muted:#8a7f74;
    --line:#e6dccf; --ok:#4a8f5a; --blue:#3b6ea5; --green:#4a8f5a; --shadow:0 2px 10px rgba(80,55,35,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.45;padding-bottom:90px;
  }
  header{
    background:linear-gradient(135deg,var(--terra),var(--terra-dark));
    color:#fff;padding:18px 16px 16px;box-shadow:var(--shadow);
  }
  header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
  header p{margin:2px 0 0;font-size:12px;opacity:.9}
  .stats{display:flex;gap:8px;margin-top:12px}
  .stat{flex:1;background:rgba(255,255,255,.15);border-radius:12px;padding:8px 6px;text-align:center}
  .stat b{display:block;font-size:20px;line-height:1}
  .stat span{font-size:10px;opacity:.9;display:block;margin-top:3px}
  .progwrap{margin-top:10px}
  .progbar{height:7px;background:rgba(255,255,255,.25);border-radius:20px;overflow:hidden}
  .progfill{height:100%;background:#fff;border-radius:20px;transition:width .4s}
  .progtxt{font-size:10px;opacity:.9;margin-top:4px;text-align:center}

  nav{display:flex;gap:6px;padding:12px 12px 8px;overflow-x:auto;position:sticky;top:0;background:var(--cream);z-index:10;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;border:none;background:var(--sand);color:var(--ink);
    padding:9px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  nav button.active{background:var(--terra);color:#fff}
  nav button.yoga.active{background:var(--teal)}

  main{padding:8px 14px 20px}
  .introbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
  .intro{font-size:12px;color:var(--muted);flex:1}
  .editbtn{flex:0 0 auto;border:1px solid var(--terra);background:#fff;color:var(--terra);
    font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;cursor:pointer}
  .editbtn.on{background:var(--terra);color:#fff}

  .block{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:1px solid var(--line)}
  .block-h{padding:11px 14px;font-size:13px;font-weight:700;color:var(--terra);background:var(--sand);letter-spacing:.3px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .yoga .block-h{color:var(--teal)}
  .block-h input{flex:1;font:inherit;font-size:13px;font-weight:700;text-transform:uppercase;color:var(--terra);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
  .ex{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-top:1px solid var(--line)}
  .ex:first-child{border-top:none}
  .cbx{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;margin-top:1px;background:#fff}
  .cbx.on{background:var(--ok);border-color:var(--ok)}
  .cbx.on::after{content:"✓";color:#fff;font-size:15px;font-weight:800}
  .ex-body{flex:1;min-width:0}
  .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ex-name{font-size:14.5px;font-weight:600}
  .info{flex:0 0 auto;border:none;background:var(--teal-light);color:var(--teal);font-size:12px;font-weight:700;border-radius:14px;padding:4px 9px;cursor:pointer}
  .ex-dose{font-size:12px;color:var(--muted);margin-top:1px}
  .last{font-size:11.5px;color:var(--teal);margin-top:4px}
  .up{font-size:11.5px;color:var(--terra-dark);font-weight:700;margin-top:2px}
  .ex-note{margin-top:7px;display:flex;gap:6px}
  .ex-note input{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;
    background:var(--cream);color:var(--ink);font-family:inherit;min-width:0;
  }
  .ex-note input.kg{flex:0 0 78px}
  .ex-note input:focus{outline:none;border-color:var(--terra);background:#fff}
  .star{color:var(--terra);font-size:11px}

  /* Registro de series con botones */
  .sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1.5px dashed var(--line);background:#fff;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .chip.done{background:var(--ok);color:#fff;border:1.5px solid var(--ok)}
  .chip.next{border:1.5px solid var(--terra);color:var(--terra)}
  .setrow{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
  .setrow label{flex:0 0 70px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .setrow input{display:block;width:100%;margin-top:2px;border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;font-size:17px;font-weight:800;text-align:center;font-family:inherit;background:#fff;color:var(--ink)}
  .setrow input:focus{outline:none;border-color:var(--terra)}
  .play{flex:0 0 auto;border:none;border-radius:10px;padding:10px 11px;font-size:13px;font-weight:800;background:var(--teal);color:#fff;cursor:pointer}
  .playsm{margin-top:6px;border:none;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:800;background:var(--teal-light);color:var(--teal);cursor:pointer}
  .logset{flex:1;border:none;border-radius:10px;padding:11px 8px;font-size:14px;font-weight:800;background:var(--terra);color:#fff;cursor:pointer;white-space:nowrap}
  .logset.extra{background:var(--sand);color:var(--ink);font-size:13px}
  .openlog{margin-top:8px;border:1px solid var(--terra);background:#fff;color:var(--terra);font-weight:700;font-size:12.5px;border-radius:10px;padding:7px 12px;cursor:pointer}
  .ex.active{background:#fffaf4}
  .lvl{margin-top:5px;width:100%;border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;font-family:inherit;background:var(--teal-light);color:var(--teal);font-weight:700}

  /* Edición */
  .ed-row{display:flex;flex-direction:column;gap:6px;flex:1}
  .ed-row input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--cream);color:var(--ink)}
  .ed-row input:focus{outline:none;border-color:var(--terra);background:#fff}
  .ed-opts{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .ed-opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .trash{flex:0 0 auto;background:none;border:none;font-size:18px;cursor:pointer;padding:2px 4px;margin-top:2px}
  .addex{width:100%;border:1px dashed var(--terra);background:#fff;color:var(--terra);font-weight:700;
    font-size:13px;padding:10px;cursor:pointer;border-top:1px solid var(--line)}
  .addblock{width:100%;border:1px dashed var(--muted);background:#fff;color:var(--muted);font-weight:700;
    font-size:13px;padding:12px;cursor:pointer;border-radius:14px;margin-bottom:14px}
  .restore{width:100%;background:none;border:none;color:#c0392b;font-size:12px;padding:10px;cursor:pointer;text-decoration:underline}

  .save{
    position:fixed;left:14px;right:84px;bottom:16px;z-index:30;
    background:var(--terra);color:#fff;border:none;border-radius:14px;padding:15px;
    font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(160,79,47,.35);cursor:pointer;
  }
  .save:active{transform:scale(.99)}
  .save.yoga{background:var(--teal);box-shadow:0 4px 16px rgba(47,125,120,.35)}

  .hitem{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:12px 14px;margin-bottom:10px}
  .hitem-h{display:flex;justify-content:space-between;align-items:center}
  .hitem-t{font-weight:700;font-size:14px}
  .hitem-d{font-size:12px;color:var(--muted)}
  .hitem-logs{margin-top:8px;font-size:12px;color:var(--ink)}
  .hitem-logs div{padding:2px 0;border-top:1px dashed var(--line)}
  .hitem-logs b{color:var(--terra-dark);font-weight:600}
  .del{background:none;border:none;color:#c0392b;font-size:12px;cursor:pointer;padding:4px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:30px;font-size:13px;z-index:70;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  .tip{background:var(--teal-light);border-radius:12px;padding:10px 13px;font-size:12.5px;color:var(--teal);margin-bottom:14px}
  .tip b{color:var(--teal)}

  /* Tarjetas genéricas */
  .card{background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:15px}
  .card p{margin:4px 0;font-size:13px}
  .small{font-size:12px;color:var(--muted)}
  .hero{background:linear-gradient(135deg,#fff,var(--sand))}
  .hero .big{font-size:22px;font-weight:800;margin:2px 0 6px}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;background:var(--terra);color:#fff;margin-top:8px}
  .btn.sec{background:var(--sand);color:var(--ink)}
  .btn.teal{background:var(--teal)}
  .row2{display:flex;gap:8px}
  .row2 .btn{flex:1}
  .dots{display:flex;gap:6px;margin:6px 0}
  .dot{width:26px;height:26px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:12px}
  .dot.on{background:var(--ok);color:#fff}
  .wk{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
  .wk:first-of-type{border-top:none}
  .remind{padding:9px 12px;border-radius:10px;background:#fff6ec;border:1px solid #f1d9bf;font-size:12.5px;margin-top:8px}

  .seg{display:flex;gap:6px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:var(--sand);padding:9px 6px;border-radius:12px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .seg button.active{background:var(--ink);color:#fff}

  .form{display:flex;gap:8px;flex-wrap:wrap}
  .form label{flex:1 1 90px;font-size:11px;color:var(--muted);font-weight:600}
  .form input,.form select{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;background:var(--cream);color:var(--ink)}
  select.full{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;background:var(--cream);color:var(--ink);margin-bottom:10px}
  .chart{width:100%;height:auto;display:block;margin-top:6px}
  .mlist{font-size:12.5px;margin-top:8px}
  .mlist div{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}

  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .pgrid figure{margin:0;position:relative}
  .pgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
  .pgrid figcaption{font-size:10px;color:var(--muted);text-align:center}
  .pgrid .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer}
  .cmp{display:flex;gap:6px;margin-top:8px}
  .cmp div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
  .cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;margin-bottom:3px;background:var(--sand)}

  /* Biblioteca / recetas */
  .search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:#fff;font-family:inherit}
  details.item{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
  details.item summary{padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
  details.item summary::-webkit-details-marker{display:none}
  details.item summary::after{content:"＋";color:var(--muted);font-weight:400}
  details.item[open] summary::after{content:"－"}
  details.item summary small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
  .ibody{padding:0 14px 14px;font-size:13px}
  .ibody h4{margin:10px 0 4px;font-size:12px;color:var(--terra-dark);text-transform:uppercase;letter-spacing:.3px}
  .ibody ol,.ibody ul{margin:0;padding-left:18px}
  .ibody li{margin:3px 0}
  .knee{background:#fff6ec;border-radius:9px;padding:7px 10px;margin-top:8px;font-size:12.5px}
  .vid{display:inline-block;margin-top:10px;background:#c4302b;color:#fff;text-decoration:none;font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:10px}
  .cat{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 2px 8px}
  .macro{display:inline-block;background:var(--teal-light);color:var(--teal);font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;margin-right:4px}

  /* Hoja inferior (cronómetro e info) */
  .timer-fab{position:fixed;right:16px;bottom:16px;z-index:40;width:54px;height:54px;border-radius:50%;
    background:var(--teal);color:#fff;border:none;font-size:24px;box-shadow:0 4px 14px rgba(47,125,120,.45);cursor:pointer}
  .timer-fab:active{transform:scale(.95)}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;opacity:0;pointer-events:none;transition:.25s}
  .backdrop.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -4px 24px rgba(0,0,0,.18);padding:18px 16px 26px;transform:translateY(115%);transition:transform .28s ease;max-height:85vh;overflow:auto}
  .sheet.open{transform:translateY(0)}
  .sheet-close{position:absolute;top:12px;right:16px;border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer}
  .timer-title{font-weight:700;font-size:14px;margin:0 0 12px;color:var(--teal)}
  .timer-tabs{display:flex;gap:8px;margin-bottom:14px}
  .timer-tabs button{flex:1;border:none;background:var(--sand);padding:10px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
  .timer-tabs button.active{background:var(--teal);color:#fff}
  .timer-presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .timer-presets button{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
  .timer-presets button.sel{border-color:var(--teal);background:var(--teal-light);color:var(--teal)}
  .timer-display{font-size:58px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:4px 0 14px;color:var(--ink)}
  .timer-display.warn{color:var(--terra)}
  .timer-ctrls{display:flex;gap:10px}
  .timer-ctrls button{flex:1;border:none;padding:15px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
  .tc-main{background:var(--teal);color:#fff}
  .tc-sec{background:var(--sand);color:var(--ink)}
  #infoBody h2{margin:0 30px 2px 0;font-size:18px}

  .daterow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
  .daterow input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px;font-family:inherit;background:var(--cream);color:var(--ink)}
  .daterow input:focus{outline:none;border-color:var(--terra);background:#fff}
</style>
</head>
<body>
<header>
  <h1>🏔️ Mi Entrenamiento</h1>
  <p>Diana · Gym + handstand · San Pedro</p>
  <div class="stats">
    <div class="stat"><b id="s-week">0/3</b><span>gym esta semana</span></div>
    <div class="stat"><b id="s-hs">0</b><span>🤸 handstand (sem)</span></div>
    <div class="stat"><b id="s-total">0</b><span>sesiones gym</span></div>
  </div>
  <div class="progwrap">
    <div class="progbar"><div class="progfill" id="progfill" style="width:0%"></div></div>
    <div class="progtxt" id="progtxt">Meta: 36 sesiones de gym en 12 semanas</div>
  </div>
</header>

<nav id="nav">
  <button data-tab="hoy" class="active">🏠 Hoy</button>
  <button data-tab="gymA">🟦 Gym A</button>
  <button data-tab="gymB">🟩 Gym B</button>
  <button data-tab="gymC">🟨 Gym C</button>
  <button data-tab="yoga" class="yoga">🧘 Yoga</button>
  <button data-tab="lib">📚 Ejercicios</button>
  <button data-tab="prog">📈 Progreso</button>
  <button data-tab="hist">📊 Historial</button>
</nav>

<main id="main"></main>

<button class="save" id="saveBtn">✓ Guardar sesión</button>

<button class="timer-fab" id="timerFab">⏱️</button>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="timerSheet">
  <button class="sheet-close" data-close>✕</button>
  <div class="timer-title" id="tmTitle">⏱️ Descanso</div>
  <div class="timer-tabs">
    <button data-tm="sw">Cronómetro</button>
    <button data-tm="cd" class="active">Temporizador</button>
  </div>
  <div class="timer-presets" id="tmPresets">
    <button data-sec="30">30 s</button>
    <button data-sec="45">45 s</button>
    <button data-sec="60">1 min</button>
    <button data-sec="90" class="sel">90 s</button>
    <button data-sec="120">2 min</button>
    <button data-sec="300">5 min</button>
    <input id="tmCustom" type="text" inputmode="decimal" placeholder="otro (min)" style="width:92px;border:1px solid var(--line);border-radius:20px;padding:8px 10px;font-size:13px;text-align:center;font-family:inherit">
  </div>
  <div class="timer-display" id="tmDisplay">01:30</div>
  <div class="timer-ctrls">
    <button class="tc-main" id="tmStart">Iniciar</button>
    <button class="tc-sec" id="tmReset">Reiniciar</button>
  </div>
</div>
<div class="sheet" id="infoSheet">
  <button class="sheet-close" data-close>✕</button>
  <div id="infoBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- RUTINAS ---------- */
// Llega en bici (13 min): el calentamiento no lleva caminadora.
function CAL(){return {t:"🔥 Calentamiento (~4 min)", ex:[
  {n:"Movilidad de hombros y caderas", d:"3 min"},
  {n:"Serie de aproximación", d:"1 serie liviana del primer ejercicio"},
]};}
function FIN(min){return {t:"🚶‍♀️ Cardio (clave para bajar grasa)", ex:[
  {n:"Caminadora inclinada", d:min+" min · 10-12% · sin agarrarte", log:true},
]};}

const DEFAULT_ROUTINES = {
  gymA:{nombre:"Gym A · Cuádriceps + empuje + tríceps", emoji:"🟦", yoga:false, blocks:[
    CAL(),
    {t:"🦵 Piernas", ex:[
      {n:"Prensa de piernas", d:"3 × 10", log:true},
      {n:"Extensión de cuádriceps", d:"3 × 10 · baja en 3 seg", log:true},
    ]},
    {t:"💪 Hombros + tríceps", ex:[
      {n:"Press de hombro con mancuernas", d:"3 × 10", log:true},
      {n:"Extensión de tríceps en polea", d:"3 × 12 · superserie con la siguiente", log:true},
      {n:"Elevaciones laterales", d:"3 × 12", log:true},
    ]},
    {t:"🧱 Abdomen + agarre", ex:[
      {n:"Elevación de piernas colgada", d:"3 × 10 · superserie con la siguiente", log:true},
      {n:"Crunch en polea", d:"3 × 12", log:true},
      {n:"Colgarse de la barra (dead hang)", d:"2 × 30-45 seg (o al máximo)", log:true},
    ]},
    FIN(15),
    {t:"🤸 Skill (opcional, ~8 min)", ex:[
      {n:"Fondos en paralelas", skill:true, log:true},
      {n:"L-sit", skill:true, log:true},
    ]},
  ]},
  gymB:{nombre:"Gym B · Glúteos + femorales + espalda + bíceps", emoji:"🟩", yoga:false, blocks:[

  "Prensa de piernas":{cat:"Piernas",musc:"Cuádriceps y glúteos",
    pasos:["Siéntate con la espalda y la cadera bien apoyadas en el respaldo.","Pies en el centro de la plataforma, separados al ancho de las caderas, puntas levemente hacia afuera.","Empuja la plataforma un poco y suelta los seguros (las manillas de los lados).","Baja la plataforma lento (2-3 seg) doblando las rodillas, hasta unos 90° o hasta donde no haya dolor, sin que la cola se despegue del asiento.","Empuja con todo el pie (sobre todo el talón) hasta casi estirar las piernas.","Al terminar la serie, vuelve a poner los seguros antes de soltar."],
    fij:["Rodillas en la misma línea que las puntas de los pies: que no se vayan hacia adentro.","Parte con poco peso: la máquina de 45° ya pesa sola (el carro)."],
    err:["Bloquear las rodillas al estirar (dejarlas totalmente rectas).","Bajar tanto que la pelvis se despega y la espalda baja se redondea."],
    rod:"Pies un poco más arriba en la plataforma = menos carga en la rodilla y más glúteo. Rango corto y sin dolor al principio.",q:"prensa de piernas 45 grados técnica correcta"},
  "Extensión de cuádriceps":{cat:"Piernas",musc:"Cuádriceps",
    pasos:["Ajusta el respaldo para que tu rodilla quede alineada con el eje de giro de la máquina (el punto que rota).","Ajusta el rodillo para que quede en la parte baja de la tibia, justo sobre el tobillo.","Tómate de las manillas y apoya bien la cola en el asiento.","Estira las piernas en 1 seg y aprieta arriba 1 seg.","Baja lento, en 3 segundos."],
    fij:["Aquí manda el control, no los kilos."],
    err:["Balancear el peso o dejarlo caer.","Rodilla desalineada del eje de la máquina."],
    rod:"Con tendinosis, hacerla LENTA es parte típica de la rehabilitación del tendón. Si hay dolor punzante: haz solo la mitad de arriba del recorrido o sostén arriba 30-45 seg (isometría).",q:"extensión de cuádriceps en máquina técnica"},
  "Hip thrust":{cat:"Glúteos",musc:"Glúteos",
    pasos:["Siéntate en el suelo con la espalda apoyada en el borde largo de un banco plano; el borde debe quedar justo bajo tus escápulas.","Pon la barra (con un protector o toalla) sobre el pliegue de la cadera, o una mancuerna sostenida con las manos. Si hay máquina de hip thrust, úsala.","Pies apoyados al ancho de caderas, a una distancia en que arriba las canillas queden verticales.","Empuja con los talones y sube la cadera hasta que hombros, cadera y rodillas queden en línea.","Aprieta los glúteos 1 seg arriba y baja controlado."],
    fij:["Mentón levemente hacia el pecho, mirada al frente (no al techo).","Arriba, pelvis levemente 'enrollada': que el glúteo termine el movimiento, no la espalda."],
    err:["Arquear la espalda baja arriba.","Pies muy lejos (se va a los femorales) o muy cerca (se va al cuádriceps)."],
    rod:"Muy amable con la rodilla: casi toda la carga va al glúteo.",q:"hip thrust con barra técnica correcta"},
  "Peso muerto rumano con mancuernas":{cat:"Glúteos",musc:"Femorales, glúteos y espalda baja",
    pasos:["De pie, pies al ancho de caderas, una mancuerna en cada mano delante de los muslos.","Dobla levemente las rodillas y déjalas así todo el ejercicio.","Lleva la cadera hacia atrás (como si cerraras una puerta con la cola) mientras las mancuernas bajan rozando las piernas.","Baja hasta sentir que se estira la parte de atrás del muslo (en general, un poco bajo la rodilla), sin perder la espalda recta.","Sube empujando la cadera hacia adelante y apretando los glúteos."],
    fij:["Espalda neutra todo el tiempo: pecho abierto, hombros hacia atrás.","Es una bisagra de cadera, no una sentadilla."],
    err:["Redondear la espalda.","Doblar mucho las rodillas.","Alejar las mancuernas del cuerpo."],
    rod:"La rodilla casi no se flexiona: muy buena opción para ti.",q:"peso muerto rumano con mancuernas técnica"},
  "Curl femoral":{cat:"Glúteos",musc:"Femorales (parte de atrás del muslo)",
    pasos:["Puede ser máquina acostada (boca abajo) o sentada.","Alinea la rodilla con el eje de giro de la máquina.","El rodillo va en la parte baja de la pantorrilla, justo sobre el talón.","Dobla las rodillas llevando los talones hacia la cola.","Aprieta 1 seg y baja lento (2-3 seg)."],
    fij:["Cadera pegada al banco o al asiento.","Unos femorales fuertes protegen la rodilla."],
    err:["Levantar la cadera para ayudarte.","Soltar el peso de golpe."],q:"curl femoral en máquina técnica"},
  "Step-up a cajón con mancuernas":{cat:"Piernas",musc:"Glúteos y cuádriceps (una pierna a la vez)",
    pasos:["Usa un cajón o banco bajo (30-40 cm): al apoyar el pie arriba, la rodilla no debe quedar más alta que la cadera.","Una mancuerna en cada mano, brazos colgando a los lados.","Apoya el pie completo sobre el cajón.","Empuja con el talón de esa pierna y sube hasta quedar de pie y estirada sobre el cajón. La pierna de abajo solo acompaña: no te impulses con ella.","Baja controlado con la misma pierna.","Haz todas las repeticiones con una pierna y luego cambia."],
    fij:["Rodilla en línea con el pie: que no se vaya hacia adentro.","Tronco levemente inclinado hacia adelante = más glúteo."],
    err:["Impulsarte con la pierna de abajo.","Cajón demasiado alto al principio."],
    rod:"Mientras más bajo el cajón, menos flexión de rodilla. Si hay dolor, baja la altura. Es una progresión hacia el pistol squat.",q:"step up con mancuernas técnica"},
  "Abductores en máquina":{cat:"Glúteos",musc:"Glúteo medio y menor (costado de la cadera)",
    pasos:["Siéntate con la espalda apoyada y ajusta las almohadillas por fuera de las rodillas.","Abre las piernas empujando hacia afuera, todo lo que puedas.","Sostén 1 seg abierta.","Vuelve lento, sin dejar que las placas choquen."],
    fij:["Inclinarte un poco hacia adelante, despegando la espalda, carga más el glúteo.","Estabiliza la rodilla: evita que se vaya hacia adentro al bajar escaleras o hacer sentadillas."],
    err:["Rebotar o soltar el peso de golpe.","Recorrido a medias."],q:"máquina de abductores técnica glúteo medio"},

  "Press de hombro con mancuernas":{cat:"Hombros",musc:"Deltoides (hombros) y tríceps",
    pasos:["Siéntate en un banco con el respaldo vertical, espalda y cabeza apoyadas, pies firmes en el suelo.","Sube las mancuernas a la altura de los hombros, palmas mirando al frente, codos un poco por delante del cuerpo.","Empuja las mancuernas hacia arriba hasta casi estirar los brazos; arriba quedan cerca una de otra, sin chocar.","Baja controlado (2 seg) hasta que las mancuernas lleguen a la altura de las orejas o el mentón."],
    fij:["Abdomen firme: la espalda baja no se despega del respaldo.","Base de fuerza para el handstand."],
    err:["Arquear la espalda baja al empujar.","Bajar solo la mitad del recorrido.","Codos totalmente abiertos hacia los lados (estresa el hombro)."],q:"press de hombro con mancuernas sentado técnica"},
  "Elevaciones laterales":{cat:"Hombros",musc:"Deltoides medio (la 'forma' del hombro)",
    pasos:["De pie, una mancuerna liviana en cada mano, a los costados.","Codos levemente doblados y fijos en esa posición.","Sube los brazos hacia los lados, guiando con los codos, hasta la altura de los hombros (no más arriba).","Arriba, las palmas miran al suelo.","Baja lento, en 2-3 segundos."],
    fij:["Peso liviano: 2-5 kg es normal aquí.","Hombros lejos de las orejas durante todo el movimiento."],
    err:["Balancear el cuerpo para subir.","Encoger los hombros (trabaja el trapecio en vez del hombro).","Subir por encima de la altura de los hombros."],q:"elevaciones laterales con mancuernas técnica"},
  "Extensión de tríceps en polea":{cat:"Tríceps",musc:"Tríceps",
    pasos:["Polea alta con barra recta o cuerda.","De pie frente a la polea, tronco apenas inclinado adelante, codos pegados a los costados.","Estira los brazos hacia abajo hasta extender completamente los codos (con cuerda: separa las puntas abajo).","Sube controlado hasta que los antebrazos queden paralelos al suelo."],
    fij:["Solo se mueven los antebrazos: los codos se quedan quietos junto al cuerpo.","Es tu punto débil: prioriza el recorrido completo antes que el peso."],
    err:["Abrir los codos o dejar que se adelanten.","Empujar con el peso del cuerpo.","Subir las manos hasta la cara."],q:"extensión de tríceps en polea con cuerda técnica"},
  "Extensión de tríceps sobre la cabeza":{cat:"Tríceps",musc:"Tríceps (sobre todo la porción larga)",
    pasos:["Sentada en un banco con respaldo vertical, toma UNA mancuerna con las dos manos por debajo del disco superior (las palmas sostienen el disco).","Súbela sobre la cabeza con los brazos estirados.","Dobla los codos y baja la mancuerna detrás de la cabeza, lento, hasta sentir el estiramiento del tríceps.","Estira los brazos de vuelta arriba."],
    fij:["Codos apuntando hacia adelante, cerca de la cabeza.","Abdomen firme para no arquear la espalda."],
    err:["Abrir mucho los codos hacia los lados.","Arquear la espalda baja al subir."],
    alt:"También se puede en polea: de espaldas a la polea, con cuerda, estirando los brazos hacia adelante y arriba.",q:"extensión de tríceps sobre la cabeza con mancuerna sentado"},
  "Press de banca con mancuernas":{cat:"Pecho",musc:"Pecho, tríceps y parte delantera del hombro",
    pasos:["Siéntate en la punta de un banco plano con las mancuernas paradas sobre los muslos.","Recuéstate llevando las mancuernas al pecho (ayúdate con un empujón de rodillas).","Pies firmes en el suelo, glúteos y espalda alta apoyados; junta las escápulas y bájalas (pecho 'orgulloso').","Empuja las mancuernas hacia arriba, sobre el pecho, hasta casi estirar los brazos.","Baja controlado (2 seg) hasta que las mancuernas queden a los lados del pecho, con los codos a unos 45-60° del cuerpo (no abiertos en forma de T).","Al terminar: lleva las mancuernas al pecho, sube las rodillas y siéntate con ellas sobre los muslos."],
    fij:["Más seguro que la barra si entrenas sola: si fallas, bajas las mancuernas a los lados.","Si usas barra: en rack y con los seguros puestos."],
    err:["Codos abiertos a 90° del cuerpo (estresa el hombro).","Despegar los glúteos del banco.","Dejar caer las mancuernas abiertas al terminar."],q:"press de banca con mancuernas técnica correcta"},

  /* Espalda y bíceps */
  "Jalón al pecho":{cat:"Espalda",musc:"Dorsales, espalda media y bíceps",
    pasos:["Ajusta el apoyo de muslos para quedar firme en el asiento.","Toma la barra un poco más ancho que los hombros, palmas hacia adelante.","Pecho arriba e inclínate apenas hacia atrás.","Primero baja los hombros (aléjalos de las orejas) y luego tira la barra hacia la parte alta del pecho, llevando los codos hacia abajo y atrás.","Sube controlado hasta estirar los brazos."],
    fij:["Piensa en 'meter los codos en los bolsillos de atrás'.","Es la base de fuerza para el pull-over."],
    err:["Tirar la barra detrás de la nuca.","Balancear el cuerpo hacia atrás para bajar la barra."],q:"jalón al pecho polea técnica correcta"},
  "Remo con mancuerna a un brazo":{cat:"Espalda",musc:"Dorsal, espalda media y bíceps",
    pasos:["Apoya la rodilla y la mano del mismo lado sobre un banco plano; la otra pierna queda en el suelo, algo separada.","Espalda recta y casi paralela al suelo.","La mancuerna cuelga con el brazo estirado, bajo el hombro.","Tira llevando el codo hacia atrás y arriba, en dirección a la cadera (no hacia afuera), hasta que la mancuerna llegue al costado de las costillas.","Baja estirando el brazo por completo."],
    fij:["El tronco no gira: el movimiento es del brazo y la escápula.","Piensa en tirar con el codo, no con la mano."],
    err:["Girar el tronco para subir la mancuerna.","Encoger el hombro hacia la oreja."],q:"remo con mancuerna a una mano apoyado en banco técnica"},
  "Curl de bíceps con mancuernas":{cat:"Bíceps",musc:"Bíceps",
    pasos:["De pie, una mancuerna en cada mano, brazos estirados a los costados, palmas mirando al frente.","Codos pegados al cuerpo y quietos.","Dobla los codos y sube las mancuernas hasta cerca de los hombros; aprieta 1 seg.","Baja lento (2-3 seg) hasta estirar completamente los brazos."],
    fij:["Solo se mueven los antebrazos.","Puedes hacerlo con los dos brazos a la vez o alternando."],
    err:["Balancear el cuerpo para subir el peso.","Adelantar los codos.","Bajar solo la mitad."],q:"curl de bíceps con mancuernas técnica correcta"},
  "Curl martillo":{cat:"Bíceps",musc:"Bíceps, braquial y antebrazo",
    pasos:["Igual que el curl de bíceps, pero con las palmas mirándose entre sí (agarre neutro, como sosteniendo un martillo) durante todo el recorrido.","Codos pegados al cuerpo y quietos.","Sube hasta cerca del hombro y baja lento."],
    fij:["Trabaja también el antebrazo: suma a tu agarre."],
    err:["Balancear el cuerpo.","Girar la muñeca durante el movimiento."],q:"curl martillo con mancuernas técnica"},
  "Remo sentada en polea":{cat:"Espalda",musc:"Espalda media, dorsales y postura",
    pasos:["Siéntate con los pies en los apoyos y las rodillas levemente dobladas.","Toma el agarre (triángulo o barra) con la espalda recta.","Primero junta las escápulas y luego tira el agarre hacia el ombligo, con los codos pegados al cuerpo.","Vuelve controlado estirando los brazos, sin encorvarte."],
    fij:["Pecho abierto, hombros lejos de las orejas.","Ideal para la contractura de espalda alta."],
    err:["Balancear el tronco hacia atrás y adelante.","Subir los hombros."],
    alt:"Si no hay polea baja: máquina de remo, o el remo con mancuerna a un brazo.",q:"remo sentado en polea baja técnica"},
  "Face pull":{cat:"Espalda",musc:"Hombro posterior, trapecio medio y manguito rotador",
    pasos:["Polea a la altura de la cara o un poco más arriba, con cuerda.","Toma las puntas de la cuerda con las palmas mirando hacia abajo y da 2 pasos atrás.","Tira la cuerda hacia tu frente separando las manos, con los codos altos (a la altura de los hombros o más).","Termina con las manos a los lados de la cabeza, como mostrando los bíceps.","Vuelve lento."],
    fij:["Peso liviano y mucho control: es para postura y salud del hombro.","Clave para la contractura de espalda alta y para el handstand."],
    err:["Usar mucho peso y tirar con el cuerpo.","Bajar los codos (se convierte en un remo)."],q:"face pull con cuerda en polea técnica"},

    err:["Balancearse o usar impulso.","Subir las piernas sin enrollar la pelvis (trabaja solo el flexor de cadera)."],q:"elevación de piernas colgado en barra técnica abdomen"},
  "Oblicuos colgada":{cat:"Abdomen",musc:"Oblicuos (costados del abdomen)",
    pasos:["Cuélgate de la barra igual que en la elevación de piernas, con los hombros activos.","Sube las rodillas juntas hacia un lado, girando la pelvis, como si quisieras llevar la cadera hacia la axila de ese lado.","Baja lento al centro.","Alterna los lados o haz todas las repeticiones de un lado y luego del otro."],
    fij:["Movimiento lento, sin balanceo."],
    err:["Balancearse de lado a lado.","Soltar los hombros."],
    alt:"Si todavía cuesta colgada: tendida de espaldas, lleva las rodillas dobladas hacia un lado y luego al otro (limpiaparabrisas).",q:"elevación de rodillas oblicua colgado barra"},
  "Crunch en polea":{cat:"Abdomen",musc:"Recto abdominal (las 'calugas')",
    pasos:["Polea alta con cuerda. Arrodíllate mirando la polea, a unos 50 cm.","Toma la cuerda y deja las manos a los lados de tu cabeza.","Enrolla la columna llevando los codos hacia los muslos, como si quisieras mirarte el ombligo.","Vuelve lento hasta estirar el abdomen."],
    fij:["La cadera se queda quieta: el movimiento es de la columna.","Exhala fuerte al bajar."],
    err:["Tirar con los brazos.","Sentarte hacia atrás sobre los talones (eso mueve la cadera, no el abdomen)."],q:"crunch en polea alta de rodillas técnica"},
  "Rueda abdominal":{cat:"Abdomen",musc:"Recto abdominal y core completo",
    pasos:["Es una rueda pequeña con una manilla a cada lado.","De rodillas sobre una colchoneta, toma la rueda con los brazos estirados bajo los hombros.","Aprieta abdomen y glúteos y enrolla levemente la pelvis.","Rueda hacia adelante lento, solo hasta donde puedas sin que la espalda baja se hunda.","Vuelve tirando con el abdomen hasta la posición inicial."],
    fij:["Empieza con recorrido corto y ve alargándolo semana a semana.","Si la espalda baja se hunde, se acabó la serie."],
    err:["Arquear la zona lumbar.","Llevar la cadera hacia atrás al volver (se mueve la cadera y no el abdomen)."],

/* ---------- ESTADO ---------- */
const KEY="entreno_diana_v1";
const GOAL=36;
const ROUTINES_VERSION=5;
function todayStr(){return dstr(new Date());}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
let data=load();
let currentTab="hoy";
let editMode=false;
let draft={};
let activeEx=null;   // ejercicio con el registro de series abierto
let cur={};          // valores kg/reps en pantalla por ejercicio
let sessionDate=todayStr();
let progSub="medidas";
let fotoPose="frente";

function load(){
  let d={};
  try{d=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
  if(!d.start)d.start=new Date().toISOString();
  if(!d.sessions)d.sessions=[];
  if(!d.medidas)d.medidas=[];
  if(!d.routines){d.routines=JSON.parse(JSON.stringify(DEFAULT_ROUTINES));d.routinesVersion=ROUTINES_VERSION;d.planStart=todayStr();}
  return d;
}
function checkRoutinesUpdate(){
  if(data.routinesVersion!==ROUTINES_VERSION){
    // Plan nuevo de gimnasio: las rutinas anteriores eran de calistenia, se reemplazan. Las sesiones guardadas se conservan.
    data.routines=JSON.parse(JSON.stringify(DEFAULT_ROUTINES));
    data.routinesVersion=ROUTINES_VERSION;data.planStart=data.planStart||todayStr();save();render();updateStats();
    toast("🆕 Rutinas A · B · C cargadas · tu historial se conserva");
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast("⚠️ No se pudo guardar");}}

const main=document.getElementById("main");
const saveBtn=document.getElementById("saveBtn");
let idMap={};
function exId(n){const id="e"+Object.keys(idMap).length;idMap[id]=n;return id;}

/* ---------- UTILIDADES ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(iso){const d=new Date(iso);const dias=["dom","lun","mar","mié","jue","vie","sáb"];
  return `${dias[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`;}
function fmtShort(ds){const d=new Date(ds.length===10?ds+'T12:00:00':ds);return d.getDate()+" "+MES[d.getMonth()];}
function weekStart(dt){const x=new Date(dt);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function isGym(t){return GYM_ORDER.includes(t);}
function sessName(t){const R=data.routines[t]||DEFAULT_ROUTINES[t];if(R)return R.emoji+" "+R.nombre.split(' · ')[0];return LEGACY[t]||t;}
function sorted(){return [...data.sessions].sort((a,b)=>new Date(a.date)-new Date(b.date));}
function thisWeek(){const ws=weekStart(new Date());return data.sessions.filter(s=>new Date(s.date)>=ws);}
function target(d){const m=String(d||"").match(/(\d+)\s*[×x]\s*(\d+)(?:\s*-\s*(\d+))?/);return m?{sets:+m[1],top:+(m[3]||m[2])}:null;}
function lastLog(n){const s=sorted();for(let i=s.length-1;i>=0;i--){const l=(s[i].logs||[]).find(x=>x.n===n);if(l)return {...l,date:s[i].date};}return null;}
function nums(s){return (String(s||"").match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));}
// Rotación A → B → C sin importar el día de la semana
function nextGym(){const g=sorted().filter(s=>isGym(s.tipo));if(!g.length)return GYM_ORDER[0];const i=GYM_ORDER.indexOf(g[g.length-1].tipo);return GYM_ORDER[(i+1)%GYM_ORDER.length];}
// Búsqueda en Google Videos: funciona en cualquier navegador (el link de búsqueda de YouTube se abría vacío en el teléfono)
function videoLink(q){return "https://www.google.com/search?tbm=vid&q="+encodeURIComponent(q);}
function skillLv(n){const e=LIB[n];if(!e||!e.niveles)return 0;const i=(data.skillLv||{})[n]||0;return Math.min(i,e.niveles.length-1);}
// Dosis efectiva: en skills manda el nivel de progresión elegido
function effD(ex){const e=LIB[ex.n];return ex.skill&&e&&e.niveles?e.niveles[skillLv(ex.n)].d:(ex.d||"");}

/* ---------- RENDER PRINCIPAL ---------- */
function render(){
  idMap={};
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
  const isRoutine=ROUTINE_TABS.includes(currentTab);
  document.body.className="";
  saveBtn.style.display="none";
  if(!isRoutine){editMode=false;}
  if(currentTab==="hoy")return renderHoy();
  if(currentTab==="lib")return renderLib();
  if(currentTab==="prog")return renderProg();
  if(currentTab==="hist")return renderHist();
  renderRoutine();
}

function renderRoutine(){
  const r=data.routines[currentTab];
  const isYoga=r.yoga;
  if(!editMode&&(!activeEx||!exByName(activeEx)))activeEx=firstActive();
  document.body.className=isYoga?"yoga":"";
  saveBtn.style.display=editMode?"none":"block";
  saveBtn.className="save"+(isYoga?" yoga":"");

  let html=`<div class="introbar">
    <div class="intro">${r.emoji} <b>${esc(r.nombre)}</b><br>${editMode?'edita, borra o agrega ejercicios':'marca cada serie con los botones · ℹ️ = cómo se hace'}</div>
    <button class="editbtn ${editMode?'on':''}" id="editToggle">${editMode?'✓ Listo':'✏️ Editar'}</button>
  </div>`;
  if(!editMode) html+=`<div class="daterow">📅 Día de la sesión <input type="date" id="sessDate" value="${sessionDate}" max="${todayStr()}"></div>`;
  if(isYoga && !editMode) html+=`<div class="tip">💡 Ideal para días de terreno o de descanso. Respira lento y sin prisa.</div>`;
  if(!isYoga && !editMode) html+=`<div class="tip">💡 <b>Peso correcto:</b> termina cada serie sintiendo que te quedaban solo 1-3 reps. Cuando completes todas las series en el tope del rango, <b>sube 1-2 kg</b>. Al marcar una serie parte solo el descanso de 90 s (⏱️).</div>`;

  r.blocks.forEach((bl,bi)=>{
    html+=`<div class="block${isYoga?' yoga':''}"><div class="block-h">`;
    html+= editMode ? `<input value="${esc(bl.t)}" data-btitle="${bi}">` : esc(bl.t);
    html+=`</div>`;
    bl.ex.forEach((ex,ei)=>{
      if(editMode){
        html+=`<div class="ex">
          <div class="ed-row">
            <input value="${esc(ex.n)}" data-en="${bi}_${ei}" placeholder="Nombre del ejercicio">
            <input value="${esc(ex.d||'')}" data-ed="${bi}_${ei}" placeholder="Series × reps (ej: 3 × 10)">
            <div class="ed-opts"><label><input type="checkbox" data-el="${bi}_${ei}" ${ex.log?'checked':''}> anotar kg / reps</label></div>
          </div>
          <button class="trash" data-del="${bi}_${ei}">🗑️</button>
        </div>`;
      }else{
        const id=exId(ex.n);
        const st=draft[ex.n]||{};
        const nm=ex.n.startsWith("★")?`<span class="star">★</span> ${esc(ex.n.slice(1).trim())}`:esc(ex.n);
        let lastHtml="";
        if(ex.log){
          const L=lastLog(ex.n);
          if(L){
            const txt=L.sets?L.v:[L.kg?L.kg+" kg":"",L.reps||(!L.kg?L.v:"")].filter(Boolean).join(" · ");
            lastHtml=`<div class="last">↩︎ Última vez (${fmtShort(L.date)}): ${esc(txt)}</div>`;
            const t=target(effD(ex)), r=nums(L.reps);
            if(t&&L.kg&&r.length>=t.sets&&r.slice(0,t.sets).every(x=>x>=t.top)) lastHtml+=`<div class="up">⬆️ Completaste todo: hoy sube 1-2 kg</div>`;
          }
        }
        const isAct=ex.log&&activeEx===ex.n;
        html+=`<div class="ex ${isAct?'active':''}">
          <div class="cbx ${st.done?'on':''}" data-cb="${id}"></div>
          <div class="ex-body">
            <div class="ex-top"><div class="ex-name">${nm}</div>${LIB[ex.n]?`<button class="info" data-info="${esc(ex.n)}">ℹ️ cómo</button>`:''}</div>
            ${ex.skill&&LIB[ex.n]&&LIB[ex.n].niveles?`<select class="lvl" data-lvl="${id}">${LIB[ex.n].niveles.map((l,i)=>`<option value="${i}" ${i===skillLv(ex.n)?'selected':''}>Nivel ${i+1}: ${esc(l.n)}</option>`).join("")}</select>`:''}
            ${effD(ex)?`<div class="ex-dose">${esc(effD(ex))}</div>`:''}
            ${lastHtml}
            ${ex.log?setsHtml(ex,id,isAct):(parseDur(ex.d)?`<button class="playsm" data-tmr="${parseDur(ex.d)}|${esc(ex.n)}">▶ Temporizador ${fmtDur(parseDur(ex.d))}</button>`:'')}
          </div></div>`;
      }
    });
    if(editMode) html+=`<button class="addex" data-addex="${bi}">+ Agregar ejercicio aquí</button>`;
    html+=`</div>`;
  });

  if(editMode){
    html+=`<button class="addblock" id="addBlock">+ Agregar bloque nuevo</button>`;
    html+=`<button class="restore" id="restore">↺ Restaurar esta rutina original</button>`;
  }
  main.innerHTML=html;
  bindRoutine();
}

/* Series: la dosis "3 × 10" define cuántas series y las reps objetivo. Sin "×" (ej: caminadora) = 1 registro en minutos, sin kg. */
function exMeta(ex){
  const d=effD(ex), t=target(d);
  const byTime=!t&&/min/.test(d);
  const secs=/×\s*(?:\d+(?:\s*-\s*\d+)?|máx)\s*seg/.test(d);
  return {t,nSets:t?t.sets:1,byTime,secs,unit:byTime?"min":(secs?"seg":"reps"),repStep:secs?5:1};
}
function curVals(ex){
  if(cur[ex.n])return cur[ex.n];
  const m=exMeta(ex), L=lastLog(ex.n), done=(draft[ex.n]&&draft[ex.n].sets)||[];
  const i=done.length, prevSet=done[i-1];
  const lastSet=L&&L.sets?(L.sets[i]||L.sets[L.sets.length-1]):null;
  let kg=prevSet?prevSet.kg:(lastSet?lastSet.kg:(L&&parseFloat(L.kg))||0);
  // reps: el número recomendado de la rutina (en series siguientes, lo mismo que la anterior)
  let reps=prevSet?prevSet.reps:(m.t?m.t.top:(m.byTime?(parseDur(effD(ex))||900)/60:(m.secs?30:10)));
  return cur[ex.n]={kg:+kg||0,reps:+reps||0};
}
function parseDur(d){const m=String(d||"").match(/(\d+)(?:\s*-\s*\d+)?\s*(min|seg)/);return m?(m[2]==="min"?+m[1]*60:+m[1]):0;}
function fmtDur(sec){return sec>=60?(sec%60?Math.floor(sec/60)+":"+String(sec%60).padStart(2,'0'):sec/60+" min"):sec+" s";}
function fmtSet(s,byTime){return byTime?`${s.reps} min`:(s.kg?`${fmtKg(s.kg)}×${s.reps}`:`${s.reps}`);}
function fmtKg(k){return String(Math.round(k*10)/10).replace('.',',');}
function setsHtml(ex,id,isAct){
  const m=exMeta(ex), sets=(draft[ex.n]&&draft[ex.n].sets)||[];
  let chips="";
  const n=Math.max(m.nSets,sets.length);
  for(let i=0;i<n;i++){
    if(i<sets.length)chips+=`<span class="chip done" data-rmset="${id}_${i}">✓ ${fmtSet(sets[i],m.byTime)}</span>`;
    else chips+=`<span class="chip ${i===sets.length?'next':''}">Serie ${i+1}</span>`;
  }
  if(m.byTime&&!sets.length)chips=`<span class="chip next">Pendiente</span>`;
  let h=`<div class="sets">${chips}</div>`;
  if(!isAct)return h+`<button class="openlog" data-act="${id}">${sets.length?'✏️ Seguir registrando':'▸ Registrar series'}</button>`;
  const c=curVals(ex);
  const next=sets.length+1, extra=sets.length>=m.nSets;
  h+=`<div class="setrow">
    ${m.byTime?'':`<label>kg<input type="text" inputmode="decimal" data-kgi="${id}" value="${c.kg?fmtKg(c.kg):''}" placeholder="0"></label>`}
    <label>${m.byTime?'min':(m.unit==='reps'?'reps':'seg')}<input type="text" inputmode="numeric" data-rpi="${id}" value="${c.reps||''}"></label>
    ${m.byTime||m.secs||parseDur(effD(ex))?`<button class="play" data-play="${id}">▶</button>`:''}
    <button class="logset ${extra?'extra':''}" data-logset="${id}">${extra?`+ Extra`:(m.byTime?'✓ Listo':`✓ Serie ${next}`)}</button>
  </div>`;
  return h;
}
function exByName(n){for(const bl of data.routines[currentTab].blocks)for(const ex of bl.ex)if(ex.n===n)return ex;return null;}
function nextActive(afterName){
  const all=[];data.routines[currentTab].blocks.forEach(bl=>bl.ex.forEach(ex=>{if(ex.log)all.push(ex);}));
  const i=all.findIndex(e=>e.n===afterName);
  for(let j=i+1;j<all.length;j++){const s=(draft[all[j].n]&&draft[all[j].n].sets)||[];if(s.length<exMeta(all[j]).nSets)return all[j].n;}
  return null;
}
function firstActive(){
  for(const bl of data.routines[currentTab].blocks)for(const ex of bl.ex){if(ex.log){const s=(draft[ex.n]&&draft[ex.n].sets)||[];if(s.length<exMeta(ex).nSets)return ex.n;}}
  return null;
}

function bindRoutine(){
  const et=document.getElementById("editToggle");
  if(et)et.onclick=()=>{editMode=!editMode;draft={};cur={};activeEx=null;render();};
  const sd=document.getElementById("sessDate");
  if(sd)sd.onchange=()=>{sessionDate=sd.value||todayStr();};
  main.querySelectorAll("[data-info]").forEach(el=>{el.onclick=()=>openInfo(el.dataset.info);});
  if(!editMode){
    main.querySelectorAll("[data-cb]").forEach(el=>{
      el.onclick=()=>{const n=idMap[el.dataset.cb];draft[n]=draft[n]||{};draft[n].done=!draft[n].done;el.classList.toggle("on",draft[n].done);};
    });
    const on=(attr,fn)=>main.querySelectorAll(`[data-${attr}]`).forEach(el=>{el.onclick=()=>{const v=el.dataset[attr.replace(/-(\w)/g,(_,c)=>c.toUpperCase())];fn(v,el);};});
    on("act",id=>{activeEx=idMap[id];render();});
    main.querySelectorAll("[data-lvl]").forEach(el=>{el.onchange=()=>{const n=idMap[el.dataset.lvl];data.skillLv=data.skillLv||{};data.skillLv[n]=+el.value;save();delete cur[n];render();};});
    main.querySelectorAll("[data-kgi]").forEach(el=>{el.oninput=()=>{const n=idMap[el.dataset.kgi],ex=exByName(n);const v=parseFloat(el.value.replace(',','.'));curVals(ex).kg=isNaN(v)?0:v;};el.onfocus=()=>el.select();});
    main.querySelectorAll("[data-rpi]").forEach(el=>{el.oninput=()=>{const n=idMap[el.dataset.rpi],ex=exByName(n);const v=parseFloat(el.value.replace(',','.'));curVals(ex).reps=isNaN(v)?0:v;};el.onfocus=()=>el.select();});
    on("play",id=>{const n=idMap[id],ex=exByName(n),m=exMeta(ex),c=curVals(ex);
      const sec=m.byTime?Math.round(c.reps*60):(m.secs?c.reps:parseDur(effD(ex)));if(sec>0&&window.TIMER)TIMER.countdown(sec*1000,n.replace('★','').trim());});
    on("tmr",v=>{const [sec,...rest]=v.split("|");TIMER.countdown(+sec*1000,rest.join("|"));});
    on("logset",id=>{
      const n=idMap[id],ex=exByName(n);if(!ex)return;

  main.querySelectorAll("[data-del]").forEach(el=>{
    el.onclick=()=>{const p=el.dataset.del.split("_").map(Number);
      if(confirm("¿Borrar este ejercicio?")){R.blocks[p[0]].ex.splice(p[1],1);save();render();}};

  main.querySelectorAll("[data-addex]").forEach(el=>{
    el.onclick=()=>{const b=+el.dataset.addex;R.blocks[b].ex.push({n:"Nuevo ejercicio",d:"",log:true});save();render();};

  const rs=document.getElementById("restore");

    data.routines[currentTab]=JSON.parse(JSON.stringify(DEFAULT_ROUTINES[currentTab]));save();render();toast("Rutina restaurada ↺");}};
}

/* ---------- PROGRESO ---------- */
function lineChart(pts,unit,color){
  if(pts.length<2)return `<p class="small">Necesitas al menos 2 registros para ver el gráfico.</p>`;
  const W=320,H=150,pl=34,pr=10,pt=12,pb=22;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<1){mn-=0.5;mx+=0.5;}
  const pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
  const t0=new Date(pts[0].x).getTime(),t1=new Date(pts[pts.length-1].x).getTime()||t0+1;
  const X=t=>pl+(t1===t0?0.5:(new Date(t).getTime()-t0)/(t1-t0))*(W-pl-pr);
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const line=pts.map(p=>`${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const fmt=v=>(Math.round(v*10)/10).toString().replace('.',',');
  let g="";[mx-pad,(mx+mn)/2,mn+pad].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6dccf" stroke-dasharray="3 3"/><text x="${pl-4}" y="${Y(v)+3}" font-size="9" fill="#8a7f74" text-anchor="end">${fmt(v)}</text>`;});
  const dots=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${color}"/>`).join("");
  const first=pts[0],last=pts[pts.length-1],diff=last.y-first.y;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${dots}
    <text x="${pl}" y="${H-6}" font-size="9" fill="#8a7f74">${fmtShort(first.x)}</text><text x="${W-pr}" y="${H-6}" font-size="9" fill="#8a7f74" text-anchor="end">${fmtShort(last.x)}</text></svg>
    <p class="small">Desde el inicio: <b style="color:${color}">${diff>0?'+':''}${fmt(diff)} ${unit}</b></p>`;
}

/* % grasa estimado: fórmula de la Marina de EE.UU. para mujeres (cm). Error típico ±3-4 puntos: sirve para ver tendencia. */
const ALTURA=160;
function navyBF(m){
  if(!m.cintura||!m.cadera||!m.cuello)return null;
  const x=m.cintura+m.cadera-m.cuello;if(x<=0)return null;
  const bf=495/(1.29579-0.35004*Math.log10(x)+0.22100*Math.log10(ALTURA))-450;
  return Math.round(bf*10)/10;
}

/* Fotos en IndexedDB (se quedan solo en este teléfono) */
const FDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open("entreno_fotos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("fotos",{keyPath:"id"});
    r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("fotos",mode);const st=t.objectStore("fotos");const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});},
  all(){return this.tx("readonly",s=>s.getAll());},
  put(o){return this.tx("readwrite",s=>s.put(o));},
  del(id){return this.tx("readwrite",s=>s.delete(id));},
};
function compress(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const max=900;let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.78));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;});}
async function renderFotos(body){
  body.innerHTML=`<div class="card"><h3>Nueva foto</h3>
    <p class="small">Cada 2 semanas · misma hora, luz y ropa · de cuerpo entero. Las fotos se guardan <b>solo en este teléfono</b>: no se suben a ningún lado.</p>

  const list=document.getElementById("fotoList");if(!list)return;

  let html=`<div class="card"><h3>🔍 Comparar (${fotoPose})</h3>
    <div class="form"><label>Antes<select id="cA">${opts(0)}</select></label><label>Después<select id="cB">${opts(mine.length-1)}</select></label></div>
    <div class="cmp"><div><img id="imA">${""}</div><div><img id="imB"></div></div></div>
    <div class="card"><h3>Todas (${fotoPose})</h3><div class="pgrid">${[...mine].reverse().map(f=>`<figure><img src="${f.img}" alt=""><button class="x" data-fdel="${f.id}">✕</button><figcaption>${fmtShort(f.date)}</figcaption></figure>`).join("")}</div></div>`;
  list.innerHTML=html;
  const upd=()=>{document.getElementById("imA").src=mine[+document.getElementById("cA").value].img;document.getElementById("imB").src=mine[+document.getElementById("cB").value].img;};
  document.getElementById("cA").onchange=upd;document.getElementById("cB").onchange=upd;upd();
  list.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=async()=>{if(confirm("¿Borrar esta foto?")){await FDB.del(+b.dataset.fdel);renderFotos(body);}});
}
let fuerzaEx=null;
function renderFuerza(body){
  const series={};
  sorted().forEach(s=>(s.logs||[]).forEach(l=>{const kg=parseFloat(String(l.kg||"").replace(',','.'));if(!isNaN(kg)&&kg>0){(series[l.n]=series[l.n]||[]).push({x:dstr(new Date(s.date)),y:kg});}}));
  const names=Object.keys(series);
  if(!names.length){body.innerHTML=`<div class="empty">Cuando anotes los kg en tus sesiones de gym, aquí verás cómo sube tu fuerza en cada ejercicio 💪</div>`;return;}
  if(!fuerzaEx||!series[fuerzaEx])fuerzaEx=names[0];
  body.innerHTML=`<div class="card"><h3>🏋️ Progresión de carga</h3>
    <select class="full" id="fEx">${names.map(n=>`<option ${n===fuerzaEx?'selected':''}>${esc(n)}</option>`).join("")}</select>
    ${lineChart(series[fuerzaEx],"kg","#3b6ea5")}</div>`;
  document.getElementById("fEx").onchange=e=>{fuerzaEx=e.target.value;renderFuerza(body);};
}

/* ---------- HISTORIAL ---------- */
function renderHist(){
  const s=[...data.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!s.length){main.innerHTML=`<div class="empty">Todavía no registras sesiones.<br>¡Haz tu primer gym y guárdalo! 💪</div>`;return;}
  let html=`<div class="intro" style="margin-bottom:14px">📊 Tu historial · ${data.sessions.length} sesiones registradas</div>`;
  s.forEach(sess=>{
    let logs="";(sess.logs||[]).forEach(l=>{logs+=`<div><b>${esc(l.n)}:</b> ${esc(l.v)}</div>`;});
    html+=`<div class="hitem">
      <div class="hitem-h"><span class="hitem-t">${esc(sessName(sess.tipo))}</span>
        <button class="del" data-del="${sess.id}">Borrar</button></div>
      <div class="hitem-d">${fmtDate(sess.date)}${isGym(sess.tipo)||ROUTINE_TABS.includes(sess.tipo)?` · ${sess.count} ejercicios`:''}</div>
      ${logs?`<div class="hitem-logs">${logs}</div>`:''}
    </div>`;
  });
  main.innerHTML=html;
  main.querySelectorAll("[data-del]").forEach(el=>{
    el.onclick=()=>{if(confirm("¿Borrar esta sesión?")){data.sessions=data.sessions.filter(x=>x.id!=el.dataset.del);save();updateStats();renderHist();}};
  });
}

function updateStats(){
  const wk=thisWeek();
  document.getElementById("s-week").textContent=wk.filter(s=>isGym(s.tipo)).length+"/3";
  document.getElementById("s-hs").textContent=wk.filter(s=>s.tipo==="handstand").length;
  const ps=data.planStart||todayStr();
  const total=data.sessions.filter(s=>isGym(s.tipo)&&dstr(new Date(s.date))>=ps).length;
  document.getElementById("s-total").textContent=total;
  const pct=Math.min(100,Math.round(total/GOAL*100));
  const wkN=Math.min(12,Math.floor((new Date(todayStr())-new Date(ps))/(7*86400000))+1);
  document.getElementById("progfill").style.width=pct+"%";
  document.getElementById("progtxt").textContent=`Semana ${wkN} de 12 · ${total} / ${GOAL} sesiones de gym (${pct}%)`;
}

let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}

document.querySelectorAll("#nav button").forEach(b=>{
  b.onclick=()=>{
    if(!editMode && ROUTINE_TABS.includes(currentTab) && Object.values(draft).some(v=>v.done)){
      if(!confirm("Tienes ejercicios marcados sin guardar. ¿Cambiar de todos modos?")) return;
    }
    draft={};cur={};activeEx=null;editMode=false;sessionDate=todayStr();currentTab=b.dataset.tab;render();
  };
});

/* ---------- HOJAS INFERIORES ---------- */
const backdrop=document.getElementById("backdrop");
function openSheet(id){document.getElementById(id).classList.add("open");backdrop.classList.add("open");}
function closeSheets(){document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("open"));backdrop.classList.remove("open");}
backdrop.onclick=closeSheets;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheets);
function openInfo(n){const e=LIB[n];if(!e)return;document.getElementById("infoBody").innerHTML=`<div class="ibody" style="padding:0">${libHtml(n,e,true)}</div>`;openSheet("infoSheet");}

/* ---------- CRONÓMETRO ---------- */
(function(){
  const disp=document.getElementById("tmDisplay");
  const presets=document.getElementById("tmPresets");
  const startBtn=document.getElementById("tmStart");
  const resetBtn=document.getElementById("tmReset");
  let mode="cd", running=false, iv=null;
  let swElapsed=0, swStart=0;
  let cdSet=90000, cdEnd=0, cdRemain=90000;
  let restMs=90000, label="Descanso";
  const title=document.getElementById("tmTitle");
  function setLabel(l){label=l;title.textContent="⏱️ "+l;}
  let actx=null;

  function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
  function beep(){try{ensureAudio();for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;const t=actx.currentTime+i*0.28;g.gain.setValueAtTime(0.35,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.start(t);o.stop(t+0.22);}}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200,100,300]);}
  function fmt(ms,ceil){let s=ceil?Math.ceil(ms/1000):Math.floor(ms/1000);if(s<0)s=0;const m=Math.floor(s/60);s=s%60;return String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');}
  const fab=document.getElementById("timerFab");
  function draw(){
    const showFab=running&&mode==="cd";
    fab.textContent=showFab?fmt(cdRemain,true):"⏱️";fab.style.fontSize=showFab?"14px":"24px";fab.style.fontWeight="800";
    if(mode==="sw"){disp.textContent=fmt(swElapsed,false);disp.classList.remove("warn");}
    else{disp.textContent=fmt(cdRemain,true);disp.classList.toggle("warn",cdRemain<=5000&&cdRemain>0);}
  }
  function tick(){
    if(mode==="sw"){swElapsed=Date.now()-swStart;draw();}
    else{cdRemain=cdEnd-Date.now();if(cdRemain<=0){cdRemain=0;draw();stop();beep();setTimeout(beep,1200);
      toast(label==="Descanso"?"⏰ ¡A la siguiente serie!":"✅ "+label+": ¡tiempo!");cdRemain=cdSet;setTimeout(draw,800);return;}draw();}
  }
  function start(){
    running=true;startBtn.textContent="Pausar";ensureAudio();
    if(mode==="sw"){swStart=Date.now()-swElapsed;}
    else{if(cdRemain<=0)cdRemain=cdSet;cdEnd=Date.now()+cdRemain;}
    iv=setInterval(tick,100);
  }
  function stop(){running=false;startBtn.textContent="Iniciar";if(iv){clearInterval(iv);iv=null;}}
  function reset(){stop();if(mode==="sw"){swElapsed=0;}else{cdRemain=cdSet;}draw();}

  fab.onclick=()=>openSheet("timerSheet");
  // Descanso automático al marcar una serie
  function countdown(ms,l){stop();mode="cd";
    document.querySelectorAll("#timerSheet [data-tm]").forEach(x=>x.classList.toggle("active",x.dataset.tm==="cd"));
    presets.style.display="flex";setLabel(l);cdSet=ms;cdRemain=ms;start();}
  window.TIMER={rest(){countdown(restMs,"Descanso");},
    countdown(ms,l){countdown(ms,l);toast("▶ "+l+" · "+fmt(ms,true));}};
  startBtn.onclick=()=>{running?stop():start();};
  resetBtn.onclick=reset;

  document.querySelectorAll("#timerSheet [data-tm]").forEach(b=>{
    b.onclick=()=>{stop();mode=b.dataset.tm;
      document.querySelectorAll("#timerSheet [data-tm]").forEach(x=>x.classList.toggle("active",x===b));
      presets.style.display=mode==="cd"?"flex":"none";
      if(mode==="cd"){cdRemain=cdSet;}else{swElapsed=0;}
      draw();};
  });
  document.querySelectorAll("#tmPresets [data-sec]").forEach(b=>{
    b.onclick=()=>{cdSet=(+b.dataset.sec)*1000;cdRemain=cdSet;stop();
      if(+b.dataset.sec<=120){restMs=cdSet;setLabel("Descanso");}else setLabel("Temporizador");
      document.querySelectorAll("#tmPresets [data-sec]").forEach(x=>x.classList.toggle("sel",x===b));
      draw();};
  });
  document.getElementById("tmCustom").onchange=e=>{const v=parseFloat(e.target.value.replace(',','.'));if(isNaN(v)||v<=0)return;
    stop();cdSet=Math.round(v*60)*1000;cdRemain=cdSet;setLabel("Temporizador");
    document.querySelectorAll("#tmPresets [data-sec]").forEach(x=>x.classList.remove("sel"));draw();};
  draw();
})();

updateStats();
render();
checkRoutinesUpdate();
</script>
</body>
